<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Світи Нашого Кохання ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000002;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* iOS Виджет Плеера */
    #ios-player {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      z-index: 50;
      background: rgba(20, 20, 25, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 77, 109, 0.3);
      border-radius: 36px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 330px;
      max-width: 90vw;
      transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.6s ease;
      opacity: 0;
    }

    #ios-player.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .player-cover {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 15px rgba(255, 42, 95, 0.45);
      flex-shrink: 0;
    }

    .player-info {
      flex: 1;
      overflow: hidden;
    }

    .player-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-subtitle {
      font-size: 0.76rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 1px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.85);
    }

    .ctrl-btn.play {
      background: rgba(255, 255, 255, 0.16);
      font-size: 1rem;
    }

    /* Подсказка старта */
    #start-hint {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      color: rgba(255, 175, 210, 0.9);
      background: rgba(20, 2, 10, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 11px 26px;
      border-radius: 30px;
      border: 1px solid rgba(255, 77, 109, 0.4);
      box-shadow: 0 0 25px rgba(255, 42, 95, 0.35);
      pointer-events: none;
      animation: pulseHint 2.4s infinite ease-in-out;
      transition: opacity 0.4s ease;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.55; transform: translateX(-50%) scale(0.98); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.02); }
    }

    /* Модальное окно просмотра воспоминания */
    #photo-card-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 60;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      background: radial-gradient(circle at center, rgba(35, 3, 16, 0.6) 0%, rgba(0, 0, 0, 0.85) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #photo-card-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .memory-card {
      background: rgba(18, 2, 8, 0.94);
      border: 1px solid rgba(255, 64, 129, 0.45);
      box-shadow: 0 0 50px rgba(255, 30, 90, 0.4);
      border-radius: 26px;
      padding: 22px 20px;
      max-width: 320px;
      width: 86%;
      text-align: center;
      transform: scale(0.7) translateY(40px);
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }

    #photo-card-container.active .memory-card {
      transform: scale(1) translateY(0);
    }

    .memory-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .memory-card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ff4d6d;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
    }

    .memory-card p {
      font-size: 0.92rem;
      color: #e0d0d8;
      line-height: 1.45;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .card-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 77, 109, 0.35);
      color: #fff;
      font-size: 0.88rem;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s all;
    }

    .btn-action.next {
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      border: none;
      box-shadow: 0 0 15px rgba(255, 42, 95, 0.5);
    }

    .btn-action:hover {
      transform: scale(1.05);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <audio id="bg-music" loop preload="auto"></audio>

  <!-- Виджет плеера iOS -->
  <div id="ios-player">
    <div class="player-cover" id="biome-icon">🌌</div>
    <div class="player-info">
      <div class="player-title" id="track-title">Космос Кохання</div>
      <div class="player-subtitle" id="track-subtitle">Galaxy Love • Світ 1/3</div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" id="btn-prev">⏮</button>
      <button class="ctrl-btn play" id="btn-play">⏸</button>
      <button class="ctrl-btn" id="btn-next">⏭</button>
    </div>
  </div>

  <div id="start-hint">ТОРКНІТЬСЯ ЕКРАНА, ЩОБ РОЗПОЧАТИ ПОДОРОЖ</div>

  <!-- Модалка фото -->
  <div id="photo-card-container">
    <div class="memory-card">
      <img id="card-img" src="" alt="Спогад">
      <h2 id="card-title"></h2>
      <p id="card-desc"></p>
      <div class="card-actions">
        <button class="btn-action next" id="next-btn">ДАЛІ 💌</button>
        <button class="btn-action" id="close-btn">ЗАКРИТИ ✕</button>
      </div>
    </div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    // 3 КАРДИНАЛЬНО РАЗНЫХ МИРА
    const biomes = [
      {
        name: "Космос Кохання",
        subtitle: "Galaxy Love • Світ 1/3",
        icon: "🌌",
        audioSrc: "music.mp3",
        bgFog: 0x000002,
        lightColor: 0xff2a6d,
        coreColor: 0xff1450
      },
      {
        name: "Поляна Сакури",
        subtitle: "Blossom Garden • Світ 2/3",
        icon: "🌸",
        audioSrc: "track2.mp3", // если нет, будет music.mp3
        bgFog: 0x08020a,
        lightColor: 0xff85a2,
        coreColor: 0xff5588
      },
      {
        name: "Захід на Океані",
        subtitle: "Sunset Ocean • Світ 3/3",
        icon: "🌊",
        audioSrc: "track3.mp3",
        bgFog: 0x030814,
        lightColor: 0xff9900,
        coreColor: 0xff5500
      }
    ];

    let currentBiomeIndex = 0;

    const memories = [
      {
        title: "Кохання Мого Життя ❤️",
        desc: "Що більше часу ми разом, то сильніше я тебе кохаю.",
        image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=700"
      },
      {
        title: "Ти Моє Серденько ✨",
        desc: "Якби я міг обрати найбезпечніше місце у світі — це було б поруч із тобою.",
        image: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=700"
      },
      {
        title: "Нескінченність ♾️",
        desc: "У будь-якій галактиці та в кожному житті я знову й знову обираю тебе.",
        image: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=700"
      },
      {
        title: "Ти і Я 🪐",
        desc: "Ти — моя найяскравіша зірка у всьому цьому безмежному всесвіті.",
        image: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=700"
      }
    ];

    let currentMemoryIndex = 0;

    const canvas = document.getElementById('webgl-canvas');
    const startHint = document.getElementById('start-hint');
    const bgMusic = document.getElementById('bg-music');

    const iosPlayer = document.getElementById('ios-player');
    const biomeIcon = document.getElementById('biome-icon');
    const trackTitle = document.getElementById('track-title');
    const trackSubtitle = document.getElementById('track-subtitle');
    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    const cardContainer = document.getElementById('photo-card-container');
    const cardImg = document.getElementById('card-img');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');
    const nextBtn = document.getElementById('next-btn');
    const closeBtn = document.getElementById('close-btn');

    // 1. Сцена и Камера
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000002, 0.007);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 36);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxDistance = 110;
    controls.minDistance = 12;
    controls.target.set(0, 0, 0);
    controls.enabled = false;

    // Фоновые звезды
    const bgStarsGeo = new THREE.BufferGeometry();
    const bgPos = new Float32Array(3000 * 3);
    for (let i = 0; i < 3000 * 3; i++) bgPos[i] = (Math.random() - 0.5) * 260;
    bgStarsGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
    const bgStarsMat = new THREE.PointsMaterial({ color: 0xffaacc, size: 0.35, transparent: true, opacity: 0.75 });
    const bgStars = new THREE.Points(bgStarsGeo, bgStarsMat);
    scene.add(bgStars);

    // 2. СПИРАЛЬ СЛОВ НА СТАРТЕ
    function createLoveWordTex(text) {
      const c = document.createElement('canvas');
      c.width = 320; c.height = 80;
      const ctx = c.getContext('2d');
      ctx.font = "bold 34px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#ff4d88"; ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 12;
      ctx.fillText(text, 160, 40);
      return new THREE.CanvasTexture(c);
    }

    const wordList = ["Te amo", "I love you", "Кохаю тебе", "Te amo", "Ti amo", "Я тебе кохаю", "Je t'aime"];
    const spiralGroup = new THREE.Group();
    scene.add(spiralGroup);
    const spiralWords = [];

    for (let i = 0; i < 150; i++) {
      const tex = createLoveWordTex(wordList[i % wordList.length]);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.98, blending: THREE.AdditiveBlending });
      const sprite = new THREE.Sprite(mat);
      const t = i / 150;
      const angle = t * Math.PI * 14; 
      const radius = 1.2 + Math.pow(t, 1.1) * 24.0;
      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.y = Math.sin(angle) * radius;
      sprite.position.z = 0;
      const scale = 1.8 + t * 4.6;
      sprite.scale.set(scale, scale * 0.25, 1);
      sprite.userData = { baseX: sprite.position.x, baseY: sprite.position.y };
      spiralWords.push(sprite);
      spiralGroup.add(sprite);
    }

    // ==============================================================
    // 3. СЕРДЦЕ ВСЕГДА В ЦЕНТРЕ (ЕДИНОЕ ДЛЯ ВСЕХ МИРОВ)
    // ==============================================================
    const heartCenterGroup = new THREE.Group();
    scene.add(heartCenterGroup);
    heartCenterGroup.scale.set(0.001, 0.001, 0.001);

    const heartLight = new THREE.PointLight(0xff2a6d, 3.5, 50);
    heartLight.position.set(0, 6.5, 0);
    heartCenterGroup.add(heartLight);

    const coreGeo = new THREE.SphereGeometry(3.2, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xff1450, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending });
    const innerCore = new THREE.Mesh(coreGeo, coreMat);
    innerCore.position.set(0, 6.5, 0);
    heartCenterGroup.add(innerCore);

    // Плотное сердце (14 000 частиц)
    const heartCount = 14000;
    const heartGeo = new THREE.BufferGeometry();
    const heartPos = new Float32Array(heartCount * 3);
    const heartColors = new Float32Array(heartCount * 3);
    const colEdge = new THREE.Color('#ff0d55');
    const colInside = new THREE.Color('#ff85a2');
    const colCore = new THREE.Color('#ffffff');

    for (let i = 0; i < heartCount; i++) {
      const i3 = i * 3;
      const t = Math.PI * 2 * Math.random();
      const xBase = 16 * Math.pow(Math.sin(t), 3);
      const yBase = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const fill = Math.pow(Math.random(), 0.6);
      const zDepth = (Math.random() - 0.5) * 8.5 * fill;

      const scale = 0.68 * fill;
      heartPos[i3] = xBase * scale;
      heartPos[i3 + 1] = yBase * scale + 6.5;
      heartPos[i3 + 2] = zDepth;

      let c = colEdge.clone();
      if (fill < 0.4) c.lerp(colCore, 1 - fill / 0.4);
      else c.lerp(colInside, 0.5);

      heartColors[i3] = c.r; heartColors[i3 + 1] = c.g; heartColors[i3 + 2] = c.b;
    }
    heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));
    const heartMat = new THREE.PointsMaterial({ size: 0.32, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.95, depthWrite: false });
    const heart = new THREE.Points(heartGeo, heartMat);
    heartCenterGroup.add(heart);

    // Парящие искры от сердца
    const embersCount = 450;
    const embersGeo = new THREE.BufferGeometry();
    const embersPos = new Float32Array(embersCount * 3);
    const embersVelocity = [];
    for (let i = 0; i < embersCount; i++) {
      embersPos[i * 3] = (Math.random() - 0.5) * 16;
      embersPos[i * 3 + 1] = 4 + Math.random() * 12;
      embersPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
      embersVelocity.push({ y: 0.03 + Math.random() * 0.04, x: (Math.random() - 0.5) * 0.015, z: (Math.random() - 0.5) * 0.015 });
    }
    embersGeo.setAttribute('position', new THREE.BufferAttribute(embersPos, 3));
    const embersMat = new THREE.PointsMaterial({ color: 0xff70a0, size: 0.45, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.8 });
    const embers = new THREE.Points(embersGeo, embersMat);
    heartCenterGroup.add(embers);

    // ==============================================================
    // 4. ТРИ КАРДИНАЛЬНО РАЗНЫХ МИРА
    // ==============================================================

    // --- МИР 1: КОСМОС (Галактика + Кольца Сатурна + Неоновая Сетка) ---
    const spaceGroup = new THREE.Group();
    scene.add(spaceGroup);
    spaceGroup.scale.set(0.001, 0.001, 0.001);

    const galaxyCount = 38000;
    const galaxyGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(galaxyCount * 3);
    const gColors = new Float32Array(galaxyCount * 3);
    const colorInside = new THREE.Color('#ff2050');
    const colorOutside = new THREE.Color('#2b0014');

    for (let i = 0; i < galaxyCount; i++) {
      const i3 = i * 3;
      const radius = Math.random() * 34;
      const spin = radius * 1.6;
      const branchAngle = ((i % 3) * 2 * Math.PI) / 3;
      const rx = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3 * radius;
      const ry = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.12 * radius;
      const rz = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3 * radius;

      positions[i3] = Math.cos(branchAngle + spin) * radius + rx;
      positions[i3 + 1] = ry - 4.5;
      positions[i3 + 2] = Math.sin(branchAngle + spin) * radius + rz;

      const mixed = colorInside.clone().lerp(colorOutside, radius / 34);
      gColors[i3] = mixed.r; gColors[i3 + 1] = mixed.g; gColors[i3 + 2] = mixed.b;
    }
    galaxyGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    galaxyGeo.setAttribute('color', new THREE.BufferAttribute(gColors, 3));
    const galaxy = new THREE.Points(galaxyGeo, new THREE.PointsMaterial({ size: 0.18, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    spaceGroup.add(galaxy);

    // Кольца Сатурна
    function makeRing(r, tiltX, col) {
      const pts = [];
      for (let i = 0; i <= 100; i++) {
        const a = (i / 100) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
      }
      const ring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.5 }));
      ring.rotation.x = tiltX;
      ring.position.y = 5.8;
      return ring;
    }
    const ringSpace = makeRing(17, 0.35, 0xff2a70);
    spaceGroup.add(ringSpace);

    const spaceGrid = new THREE.GridHelper(52, 28, 0xff2a70, 0x550a25);
    spaceGrid.position.y = -6.5;
    spaceGrid.material.transparent = true; spaceGrid.material.opacity = 0.45;
    spaceGroup.add(spaceGrid);

    // --- МИР 2: ПОЛЯНА САКУРЫ (Зеленая трава с цветами + Вихрь лепестков) ---
    const sakuraGroup = new THREE.Group();
    scene.add(sakuraGroup);
    sakuraGroup.visible = false;

    // Поляна травы и цветов
    const grassCount = 18000;
    const grassGeo = new THREE.BufferGeometry();
    const grassPos = new Float32Array(grassCount * 3);
    const grassCol = new Float32Array(grassCount * 3);
    const cGrass1 = new THREE.Color('#0f5132');
    const cGrass2 = new THREE.Color('#20c997');
    const cFlower = new THREE.Color('#ff758c');

    for (let i = 0; i < grassCount; i++) {
      const rad = 2 + Math.random() * 38;
      const ang = Math.random() * Math.PI * 2;
      grassPos[i * 3] = Math.cos(ang) * rad;
      grassPos[i * 3 + 1] = -5.8 + (Math.random() - 0.5) * 0.8;
      grassPos[i * 3 + 2] = Math.sin(ang) * rad;

      // 85% трава, 15% яркие цветки
      let c = (Math.random() < 0.15) ? cFlower : cGrass1.clone().lerp(cGrass2, Math.random());
      grassCol[i * 3] = c.r; grassCol[i * 3 + 1] = c.g; grassCol[i * 3 + 2] = c.b;
    }
    grassGeo.setAttribute('position', new THREE.BufferAttribute(grassPos, 3));
    grassGeo.setAttribute('color', new THREE.BufferAttribute(grassCol, 3));
    const grassField = new THREE.Points(grassGeo, new THREE.PointsMaterial({ size: 0.35, vertexColors: true, transparent: true, opacity: 0.85 }));
    sakuraGroup.add(grassField);

    // 2500 летающих лепестков сакуры
    const petalsCount = 2500;
    const petalsGeo = new THREE.BufferGeometry();
    const petalsPos = new Float32Array(petalsCount * 3);
    const petalsVel = [];

    for (let i = 0; i < petalsCount; i++) {
      petalsPos[i * 3] = (Math.random() - 0.5) * 55;
      petalsPos[i * 3 + 1] = -5 + Math.random() * 26;
      petalsPos[i * 3 + 2] = (Math.random() - 0.5) * 55;
      petalsVel.push({
        x: (Math.random() - 0.5) * 0.08,
        y: -0.02 - Math.random() * 0.03,
        z: (Math.random() - 0.5) * 0.08,
        rotSpeed: 0.02 + Math.random() * 0.04
      });
    }
    petalsGeo.setAttribute('position', new THREE.BufferAttribute(petalsPos, 3));
    const petalsMat = new THREE.PointsMaterial({ color: 0xffa8c5, size: 0.55, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
    const petalsField = new THREE.Points(petalsGeo, petalsMat);
    sakuraGroup.add(petalsField);

    // --- МИР 3: ЗАХОД СОНЦА НА ОКЕАНЕ (Морская поверхность с 3D-волнами) ---
    const oceanGroup = new THREE.Group();
    scene.add(oceanGroup);
    oceanGroup.visible = false;

    // Сетка волнующегося океана (60x60 сегментов)
    const oceanGeo = new THREE.PlaneGeometry(80, 80, 65, 65);
    oceanGeo.rotateX(-Math.PI / 2);
    const oceanMat = new THREE.MeshBasicMaterial({
      color: 0x023e8a,
      wireframe: true,
      transparent: true,
      opacity: 0.45
    });
    const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
    oceanMesh.position.y = -6.2;
    oceanGroup.add(oceanMesh);

    // Золотые солнечные блики на воде
    const sparksCount = 2000;
    const sparksGeo = new THREE.BufferGeometry();
    const sparksPos = new Float32Array(sparksCount * 3);
    for (let i = 0; i < sparksCount; i++) {
      sparksPos[i * 3] = (Math.random() - 0.5) * 60;
      sparksPos[i * 3 + 1] = -6.0 + Math.random() * 0.4;
      sparksPos[i * 3 + 2] = (Math.random() - 0.5) * 60;
    }
    sparksGeo.setAttribute('position', new THREE.BufferAttribute(sparksPos, 3));
    const sparksMat = new THREE.PointsMaterial({ color: 0xffb703, size: 0.35, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.85 });
    const sparksField = new THREE.Points(sparksGeo, sparksMat);
    oceanGroup.add(sparksField);

    // Огромное закатное солнце на горизонте
    const sunGeo = new THREE.CircleGeometry(18, 48);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.55 });
    const sunsetSun = new THREE.Mesh(sunGeo, sunMat);
    sunsetSun.position.set(0, 4, -45);
    oceanGroup.add(sunsetSun);

    // ==============================================================
    // 5. ФОТО-МЕДАЛЬОНЫ ВОКРУГ СЕРДЦА
    // ==============================================================
    function createMiniBadge(imgUrl, callback) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = imgUrl;
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 160; c.height = 160;
        const ctx = c.getContext('2d');
        ctx.beginPath(); ctx.arc(80, 80, 70, 0, Math.PI * 2);
        ctx.fillStyle = '#ff2060'; ctx.shadowColor = '#ff2060'; ctx.shadowBlur = 15; ctx.fill();
        ctx.save(); ctx.beginPath(); ctx.arc(80, 80, 64, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(img, 0, 0, 160, 160); ctx.restore();
        ctx.beginPath(); ctx.arc(80, 80, 64, 0, Math.PI * 2); ctx.lineWidth = 6; ctx.strokeStyle = '#ffffff'; ctx.stroke();
        ctx.font = '24px sans-serif'; ctx.fillText('💖', 120, 140);
        callback(new THREE.CanvasTexture(c));
      };
    }

    const miniBadges = [];
    const badgesGroup = new THREE.Group();
    scene.add(badgesGroup);
    badgesGroup.scale.set(0.001, 0.001, 0.001);

    memories.forEach((mem, index) => {
      createMiniBadge(mem.image, (texture) => {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
        sprite.scale.set(2.8, 2.8, 1);
        const angle = (index / memories.length) * Math.PI * 2;
        const radius = 15.5;
        sprite.position.set(Math.cos(angle) * radius, -2.5, Math.sin(angle) * radius);
        sprite.userData = { index: index, baseAngle: angle, radius: radius };
        miniBadges.push(sprite);
        badgesGroup.add(sprite);
      });
    });

    // ==============================================================
    // 6. ПЕРЕКЛЮЧЕНИЕ СЦЕН И МУЗЫКИ (КАРДИНАЛЬНАЯ СМЕНА)
    // ==============================================================
    function switchBiome(index) {
      currentBiomeIndex = index;
      const b = biomes[index];

      // UI плеера
      biomeIcon.textContent = b.icon;
      trackTitle.textContent = b.name;
      trackSubtitle.textContent = b.subtitle;

      // Смена аудио
      bgMusic.src = b.audioSrc;
      bgMusic.play().catch(e => {
        // Если файла нет, возвращаем дефолтный
        bgMusic.src = "music.mp3";
        bgMusic.play().catch(() => {});
      });
      btnPlay.textContent = "⏸";

      // Смена фона и тумана
      scene.fog.color.setHex(b.bgFog);
      document.body.style.backgroundColor = '#' + b.bgFog.toString(16).padStart(6, '0');

      // Цвет подсветки сердца
      innerCore.material.color.setHex(b.coreColor);
      heartLight.color.setHex(b.lightColor);

      // Кардинальное скрытие/показ миров
      spaceGroup.visible = (index === 0);
      sakuraGroup.visible = (index === 1);
      oceanGroup.visible = (index === 2);
    }

    btnNext.addEventListener('click', (e) => {
      e.stopPropagation();
      currentBiomeIndex = (currentBiomeIndex + 1) % biomes.length;
      switchBiome(currentBiomeIndex);
    });

    btnPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      currentBiomeIndex = (currentBiomeIndex - 1 + biomes.length) % biomes.length;
      switchBiome(currentBiomeIndex);
    });

    btnPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      if (bgMusic.paused) {
        bgMusic.play();
        btnPlay.textContent = "⏸";
      } else {
        bgMusic.pause();
        btnPlay.textContent = "▶️";
      }
    });

    // Клик по фото
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let pStartX = 0, pStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      pStartX = e.clientX; pStartY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (!flightActive && flightProgress === 0) {
        startHyperspaceFlight();
        return;
      }
      if (cardContainer.classList.contains('active')) return;
      if (Math.hypot(e.clientX - pStartX, e.clientY - pStartY) > 6) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const badgeHits = raycaster.intersectObjects(miniBadges);
      if (badgeHits.length > 0) {
        showMemory(badgeHits[0].object.userData.index);
      }
    });

    function showMemory(index) {
      currentMemoryIndex = index;
      const data = memories[index];
      cardImg.src = data.image;
      cardTitle.textContent = data.title;
      cardDesc.textContent = data.desc;
      cardContainer.classList.add('active');
    }

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMemoryIndex = (currentMemoryIndex + 1) % memories.length;
      showMemory(currentMemoryIndex);
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      cardContainer.classList.remove('active');
    });

    cardContainer.addEventListener('click', (e) => {
      if (e.target === cardContainer) cardContainer.classList.remove('active');
    });

    // ==============================================================
    // 7. СТАРТ И ПРОЛЕТ СКВОЗЬ СПИРАЛЬ
    // ==============================================================
    let flightActive = false;
    let flightProgress = 0;
    const startCamPos = new THREE.Vector3(0, 0, 36);
    const endCamPos = new THREE.Vector3(0, 26, 56);

    function startHyperspaceFlight() {
      flightActive = true;
      startHint.style.opacity = '0';
      setTimeout(() => startHint.remove(), 400);

      iosPlayer.classList.add('visible');
      switchBiome(0); // Стартуем в космосе
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Спираль слов до старта
      if (!flightActive && flightProgress === 0) {
        spiralGroup.rotation.z = -t * 0.16;
      }

      // Полет
      if (flightActive) {
        flightProgress += 0.012;
        const p = Math.min(flightProgress, 1);
        const ease = p * p * (3 - 2 * p);

        camera.position.x = (1 - ease) * startCamPos.x + ease * endCamPos.x;
        camera.position.y = Math.sin(ease * Math.PI * 0.5) * endCamPos.y;
        camera.position.z = THREE.MathUtils.lerp(startCamPos.z, endCamPos.z, ease);
        camera.lookAt(0, 0, 0);

        spiralGroup.rotation.z -= (0.02 + ease * 0.1);
        spiralWords.forEach(s => {
          s.position.x = s.userData.baseX * (1 + ease * 4.0);
          s.position.y = s.userData.baseY * (1 + ease * 4.0);
          s.material.opacity = Math.max(0, 0.98 - ease * 1.3);
        });

        // Сердце и миры раскрываются
        heartCenterGroup.scale.set(ease, ease, ease);
        spaceGroup.scale.set(ease, ease, ease);
        badgesGroup.scale.set(ease, ease, ease);

        if (p >= 1) {
          flightActive = false;
          scene.remove(spiralGroup);
          controls.enabled = true;
        }
      }

      // Жизнь активного мира
      if (flightProgress >= 1) {
        // Сердце бьется ВСЕГДА в центре во всех мирах
        const beat = 1 + Math.sin(t * 3.4) * 0.07;
        heart.scale.set(beat, beat, beat);
        innerCore.scale.set(beat * 1.1, beat * 1.1, beat * 1.1);
        heartLight.intensity = 2.5 + Math.sin(t * 3.4) * 1.5;

        // Парящие искры от сердца
        const posAttr = embersGeo.attributes.position;
        for (let i = 0; i < embersCount; i++) {
          posAttr.array[i * 3 + 1] += embersVelocity[i].y;
          posAttr.array[i * 3] += embersVelocity[i].x;
          posAttr.array[i * 3 + 2] += embersVelocity[i].z;
          if (posAttr.array[i * 3 + 1] > 18) {
            posAttr.array[i * 3 + 1] = 3.5;
            posAttr.array[i * 3] = (Math.random() - 0.5) * 10;
            posAttr.array[i * 3 + 2] = (Math.random() - 0.5) * 8;
          }
        }
        embersGeo.needsUpdate = true;

        // Вращение фото-медальонов вокруг сердца
        miniBadges.forEach((b, i) => {
          const curAngle = b.userData.baseAngle + t * 0.1;
          b.position.x = Math.cos(curAngle) * b.userData.radius;
          b.position.z = Math.sin(curAngle) * b.userData.radius;
          b.position.y = -2.5 + Math.sin(t * 2 + i) * 0.4;
        });

        // Анимация 1: Космос
        if (spaceGroup.visible) {
          galaxy.rotation.y += 0.002;
          spaceGrid.rotation.y = t * 0.015;
          ringSpace.rotation.y = t * 0.04;
        }

        // Анимация 2: Поляна Сакуры (вихрь лепестков)
        if (sakuraGroup.visible) {
          const pPos = petalsGeo.attributes.position;
          for (let i = 0; i < petalsCount; i++) {
            pPos.array[i * 3] += petalsVel[i].x + Math.sin(t + i) * 0.02;
            pPos.array[i * 3 + 1] += petalsVel[i].y;
            pPos.array[i * 3 + 2] += petalsVel[i].z + Math.cos(t + i) * 0.02;

            if (pPos.array[i * 3 + 1] < -6) {
              pPos.array[i * 3 + 1] = 20;
              pPos.array[i * 3] = (Math.random() - 0.5) * 55;
              pPos.array[i * 3 + 2] = (Math.random() - 0.5) * 55;
            }
          }
          petalsGeo.needsUpdate = true;
          grassField.rotation.y = t * 0.005;
        }

        // Анимация 3: Закат на Океане (3D-волны)
        if (oceanGroup.visible) {
          const pos = oceanGeo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const u = pos.getX(i);
            const v = pos.getZ(i);
            const wave = Math.sin(u * 0.25 + t * 2.2) * 0.65 + Math.cos(v * 0.25 + t * 1.8) * 0.65;
            pos.setY(i, wave);
          }
          pos.needsUpdate = true;
          sparksField.rotation.y = -t * 0.01;
        }

        controls.update();
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
