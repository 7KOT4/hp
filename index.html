<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Галактика Кохання ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030005;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* Стартовий екран */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #260212 0%, #030005 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .card-start {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 77, 109, 0.3);
      padding: 35px 25px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(255, 20, 90, 0.25);
      max-width: 320px;
      width: 85%;
    }

    .title {
      font-size: 2.1rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 18px rgba(255, 77, 109, 0.8);
      margin-bottom: 15px;
    }

    .mascot {
      font-size: 70px;
      margin: 15px 0 25px 0;
      animation: floatMascot 2.5s ease-in-out infinite alternate;
      display: inline-block;
    }

    @keyframes floatMascot {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-10px) scale(1.05); }
    }

    .btn-start {
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      border: none;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 13px 36px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 42, 95, 0.65);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(255, 42, 95, 0.9);
    }

    /* Модальне вікно для фото */
    #photo-card-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      background: radial-gradient(circle at center, rgba(35, 3, 16, 0.6) 0%, rgba(0, 0, 0, 0.8) 100%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #photo-card-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .memory-card {
      background: rgba(18, 2, 8, 0.92);
      border: 1px solid rgba(255, 64, 129, 0.45);
      box-shadow: 0 0 50px rgba(255, 30, 90, 0.4);
      border-radius: 26px;
      padding: 22px 20px;
      max-width: 320px;
      width: 86%;
      text-align: center;
      transform: scale(0.7) translateY(40px);
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }

    #photo-card-container.active .memory-card {
      transform: scale(1) translateY(0);
    }

    .memory-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .memory-card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ff4d6d;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
    }

    .memory-card p {
      font-size: 0.92rem;
      color: #e0d0d8;
      line-height: 1.45;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .card-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 77, 109, 0.35);
      color: #fff;
      font-size: 0.88rem;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s all;
    }

    .btn-action.next {
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      border: none;
      box-shadow: 0 0 15px rgba(255, 42, 95, 0.5);
    }

    .btn-action:hover {
      transform: scale(1.05);
    }

    .hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Аудіо music.mp3 -->
  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

  <!-- Стартовий екран -->
  <div id="start-screen">
    <div class="card-start">
      <h1 class="title">Галактика Кохання</h1>
      <div class="mascot">🐰🤍🐱</div>
      <button class="btn-start" id="start-btn">
        РОЗПОЧАТИ 💌
      </button>
    </div>
  </div>

  <!-- Модальне вікно для фото -->
  <div id="photo-card-container">
    <div class="memory-card">
      <img id="card-img" src="" alt="Спогад">
      <h2 id="card-title"></h2>
      <p id="card-desc"></p>
      <div class="card-actions">
        <button class="btn-action next" id="next-btn">ДАЛІ 💌</button>
        <button class="btn-action" id="close-btn">ЗАКРИТИ ✕</button>
      </div>
    </div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    const memories = [
      {
        title: "Кохання Мого Життя ❤️",
        desc: "Що більше часу ми разом, то сильніше я тебе кохаю.",
        image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=700"
      },
      {
        title: "Ти Моє Серденько ✨",
        desc: "Якби я міг обрати найбезпечніше місце у світі — це було б поруч із тобою.",
        image: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=700"
      },
      {
        title: "Нескінченність ♾️",
        desc: "У будь-якій галактиці та в кожному житті я знову й знову обираю тебе.",
        image: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=700"
      },
      {
        title: "Ти і Я 🪐",
        desc: "Ти — моя найяскравіша зірка у всьому цьому безмежному всесвіті.",
        image: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=700"
      }
    ];

    let currentMemoryIndex = 0;

    const canvas = document.getElementById('webgl-canvas');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    const cardContainer = document.getElementById('photo-card-container');
    const cardImg = document.getElementById('card-img');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');
    const nextBtn = document.getElementById('next-btn');
    const closeBtn = document.getElementById('close-btn');

    // 1. Сцена та Камера (стабільне налаштування як було раніше)
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030005, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 26, 56);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // OrbitControls: вільне обертання без скидання назад
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxDistance = 110;
    controls.minDistance = 12;

    // Головна група всієї галактики (для плавної анімації розгортання)
    const galaxyWorld = new THREE.Group();
    galaxyWorld.scale.set(0.001, 0.001, 0.001); // Початково в точці
    scene.add(galaxyWorld);

    // 2. Фоновий зоряний пил
    const bgStarsGeo = new THREE.BufferGeometry();
    const bgPos = new Float32Array(2500 * 3);
    for (let i = 0; i < 2500 * 3; i++) {
      bgPos[i] = (Math.random() - 0.5) * 220;
    }
    bgStarsGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
    const bgStarsMat = new THREE.PointsMaterial({ color: 0xffaacc, size: 0.35, transparent: true, opacity: 0.8 });
    scene.add(new THREE.Points(bgStarsGeo, bgStarsMat));

    // 3. Спіральна Галактика
    const galaxyCount = 38000;
    const galaxyGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(galaxyCount * 3);
    const colors = new Float32Array(galaxyCount * 3);
    const colorInside = new THREE.Color('#ff2050');
    const colorOutside = new THREE.Color('#2b0014');

    for (let i = 0; i < galaxyCount; i++) {
      const i3 = i * 3;
      const radius = Math.random() * 34;
      const spin = radius * 1.6;
      const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

      const rx = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3 * radius;
      const ry = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.12 * radius;
      const rz = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3 * radius;

      positions[i3] = Math.cos(branchAngle + spin) * radius + rx;
      positions[i3 + 1] = ry - 4.5;
      positions[i3 + 2] = Math.sin(branchAngle + spin) * radius + rz;

      const mixed = colorInside.clone().lerp(colorOutside, radius / 34);
      colors[i3] = mixed.r;
      colors[i3 + 1] = mixed.g;
      colors[i3 + 2] = mixed.b;
    }
    galaxyGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    galaxyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const galaxyMat = new THREE.PointsMaterial({
      size: 0.18,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true
    });
    const galaxy = new THREE.Points(galaxyGeo, galaxyMat);
    galaxyWorld.add(galaxy);

    // 4. Сяюче 3D-серце
    const heartCount = 6500;
    const heartGeo = new THREE.BufferGeometry();
    const heartPos = new Float32Array(heartCount * 3);

    for (let i = 0; i < heartCount; i++) {
      const i3 = i * 3;
      const t = Math.PI * 2 * Math.random();
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const z = (Math.random() - 0.5) * 8;
      const scale = 0.65;

      heartPos[i3] = x * scale;
      heartPos[i3 + 1] = y * scale + 6.5;
      heartPos[i3 + 2] = z * scale;
    }
    heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    const heartMat = new THREE.PointsMaterial({
      color: 0xff1447,
      size: 0.28,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.95
    });
    const heart = new THREE.Points(heartGeo, heartMat);
    galaxyWorld.add(heart);

    // 5. Текстові написи
    function createTextSprite(text) {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      c.width = 512;
      c.height = 128;
      ctx.fillStyle = "rgba(255, 45, 95, 0.95)";
      ctx.shadowColor = "#ff0055";
      ctx.shadowBlur = 18;
      ctx.font = "Bold 34px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(text, 256, 75);

      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(7.5, 1.85, 1);
      return sprite;
    }

    const words = ["КОХАЮ ТЕБЕ", "НАЗАВЖДИ ∞", "МОЄ СЕРДЕНЬКО", "ВІЧНЕ КОХАННЯ"];
    const labelsGroup = new THREE.Group();
    galaxyWorld.add(labelsGroup);

    words.forEach((w, idx) => {
      const s = createTextSprite(w);
      const angle = (idx / words.length) * Math.PI * 2;
      s.position.set(Math.cos(angle) * 22, -2, Math.sin(angle) * 22);
      labelsGroup.add(s);
    });

    // 6. Міні-аватарки в дискі
    function createMiniBadge(imgUrl, callback) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = imgUrl;
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 160;
        c.height = 160;
        const ctx = c.getContext('2d');

        ctx.beginPath();
        ctx.arc(80, 80, 70, 0, Math.PI * 2);
        ctx.fillStyle = '#ff2060';
        ctx.shadowColor = '#ff2060';
        ctx.shadowBlur = 15;
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.arc(80, 80, 64, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, 0, 0, 160, 160);
        ctx.restore();

        ctx.beginPath();
        ctx.arc(80, 80, 64, 0, Math.PI * 2);
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.font = '24px sans-serif';
        ctx.fillText('💖', 120, 140);

        const tex = new THREE.CanvasTexture(c);
        callback(tex);
      };
    }

    const miniBadges = [];
    const badgesGroup = new THREE.Group();
    galaxyWorld.add(badgesGroup);

    memories.forEach((mem, index) => {
      createMiniBadge(mem.image, (texture) => {
        const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(mat);

        sprite.scale.set(2.8, 2.8, 1);

        const angle = (index / memories.length) * Math.PI * 2;
        const radius = 15.5;
        sprite.position.set(Math.cos(angle) * radius, -2.5, Math.sin(angle) * radius);

        sprite.userData = { index: index, baseAngle: angle, radius: radius };
        miniBadges.push(sprite);
        badgesGroup.add(sprite);
      });
    });

    // 7. Чітке розпізнавання кліку (щоб не плутати клік зі свайпом/обертанням)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let pointerStartX = 0;
    let pointerStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (cardContainer.classList.contains('active')) return;

      // Якщо палець/миша зрушились більше ніж на 6 пікселів — це було обертання сцени, НЕ клік!
      const dist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
      if (dist > 6) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(miniBadges);

      if (hits.length > 0) {
        showMemory(hits[0].object.userData.index);
      }
    });

    function showMemory(index) {
      currentMemoryIndex = index;
      const data = memories[index];
      cardImg.src = data.image;
      cardTitle.textContent = data.title;
      cardDesc.textContent = data.desc;
      cardContainer.classList.add('active');
    }

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMemoryIndex = (currentMemoryIndex + 1) % memories.length;
      showMemory(currentMemoryIndex);
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      cardContainer.classList.remove('active');
    });

    cardContainer.addEventListener('click', (e) => {
      if (e.target === cardContainer) {
        cardContainer.classList.remove('active');
      }
    });

    // 8. Анімація появи всієї системи при кліку на «РОЗПОЧАТИ»
    let isSpawning = false;
    let spawnStartTime = 0;

    startBtn.addEventListener('click', () => {
      startScreen.classList.add('hidden');
      if (bgMusic) {
        bgMusic.play().catch(e => console.log("Audio waiting:", e));
      }

      isSpawning = true;
      spawnStartTime = performance.now();
    });

    // 9. Анімаційний цикл
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Плавне розгортання галактики з центру при старті
      if (isSpawning) {
        const progress = Math.min((performance.now() - spawnStartTime) / 2200, 1);
        // Кубічне виринання з м'яким відскоком (overshoot)
        const scaleVal = 1 - Math.pow(1 - progress, 3);
        galaxyWorld.scale.set(scaleVal, scaleVal, scaleVal);

        // Прискорене розкручування диска на старті
        galaxy.rotation.y += (1 - progress) * 0.05;

        if (progress >= 1) {
          galaxyWorld.scale.set(1, 1, 1);
          isSpawning = false;
        }
      }

      // Постійний рух галактики
      galaxy.rotation.y += 0.002;
      labelsGroup.rotation.y = -t * 0.08;

      // Рух і покачування маленьких фото
      miniBadges.forEach((b, i) => {
        const curAngle = b.userData.baseAngle + t * 0.1;
        b.position.x = Math.cos(curAngle) * b.userData.radius;
        b.position.z = Math.sin(curAngle) * b.userData.radius;
        b.position.y = -2.5 + Math.sin(t * 2 + i) * 0.4;
      });

      // Живе серцебиття (пульсація)
      const beat = 1 + Math.sin(t * 3.2) * 0.06;
      heart.scale.set(beat, beat, beat);

      // Оновлення обертання сцени
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
