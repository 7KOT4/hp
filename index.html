<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Світи Нашого Кохання ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000002;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* ==============================================================
       ПЛЕЕР В СТИЛЕ IOS (DYNAMIC ISLAND / APPLE MUSIC WIDGET)
       ============================================================== */
    #ios-player {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      z-index: 50;
      background: rgba(20, 20, 25, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 25px rgba(255, 77, 109, 0.25);
      border-radius: 36px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 330px;
      max-width: 90vw;
      transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.6s ease;
      opacity: 0;
    }

    #ios-player.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .player-cover {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 15px rgba(255, 42, 95, 0.45);
      flex-shrink: 0;
    }

    .player-info {
      flex: 1;
      overflow: hidden;
    }

    .player-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-subtitle {
      font-size: 0.76rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 1px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.85);
    }

    .ctrl-btn.play {
      background: rgba(255, 255, 255, 0.16);
      font-size: 1rem;
    }

    /* Подсказка старта */
    #start-hint {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      color: rgba(255, 175, 210, 0.9);
      background: rgba(20, 2, 10, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 11px 26px;
      border-radius: 30px;
      border: 1px solid rgba(255, 77, 109, 0.4);
      box-shadow: 0 0 25px rgba(255, 42, 95, 0.35);
      pointer-events: none;
      animation: pulseHint 2.4s infinite ease-in-out;
      transition: opacity 0.4s ease;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.55; transform: translateX(-50%) scale(0.98); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.02); }
    }

    /* Модальное окно просмотра воспоминания */
    #photo-card-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 60;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      background: radial-gradient(circle at center, rgba(35, 3, 16, 0.6) 0%, rgba(0, 0, 0, 0.85) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #photo-card-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .memory-card {
      background: rgba(18, 2, 8, 0.94);
      border: 1px solid rgba(255, 64, 129, 0.45);
      box-shadow: 0 0 50px rgba(255, 30, 90, 0.4);
      border-radius: 26px;
      padding: 22px 20px;
      max-width: 320px;
      width: 86%;
      text-align: center;
      transform: scale(0.7) translateY(40px);
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }

    #photo-card-container.active .memory-card {
      transform: scale(1) translateY(0);
    }

    .memory-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .memory-card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ff4d6d;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
    }

    .memory-card p {
      font-size: 0.92rem;
      color: #e0d0d8;
      line-height: 1.45;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .card-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 77, 109, 0.35);
      color: #fff;
      font-size: 0.88rem;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s all;
    }

    .btn-action.next {
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      border: none;
      box-shadow: 0 0 15px rgba(255, 42, 95, 0.5);
    }

    .btn-action:hover {
      transform: scale(1.05);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Аудиоплеер -->
  <audio id="bg-music" loop preload="auto"></audio>

  <!-- Виджет плеера iOS -->
  <div id="ios-player">
    <div class="player-cover" id="biome-icon">🌌</div>
    <div class="player-info">
      <div class="player-title" id="track-title">Космос Кохання</div>
      <div class="player-subtitle" id="track-subtitle">Galaxy Love • Світ 1/3</div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" id="btn-prev">⏮</button>
      <button class="ctrl-btn play" id="btn-play">⏸</button>
      <button class="ctrl-btn" id="btn-next">⏭</button>
    </div>
  </div>

  <div id="start-hint">ТОРКНІТЬСЯ ЕКРАНА, ЩОБ РОЗПОЧАТИ ПОДОРОЖ</div>

  <!-- Модалка просмотра -->
  <div id="photo-card-container">
    <div class="memory-card">
      <img id="card-img" src="" alt="Спогад">
      <h2 id="card-title"></h2>
      <p id="card-desc"></p>
      <div class="card-actions">
        <button class="btn-action next" id="next-btn">ДАЛІ 💌</button>
        <button class="btn-action" id="close-btn">ЗАКРИТИ ✕</button>
      </div>
    </div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    // ==============================================================
    // КОНФИГУРАЦИЯ СЦЕН И МУЗЫКИ
    // Можешь назвать свои аудиофайлы track1.mp3, track2.mp3, track3.mp3
    // Либо оставить music.mp3 для первого
    // ==============================================================
    const biomes = [
      {
        name: "Космос Кохання",
        subtitle: "Galaxy Love • Світ 1/3",
        icon: "🌌",
        audioSrc: "music.mp3",
        bgFog: 0x000002,
        coreColor: 0xff1450,
        lightColor: 0xff2a6d,
        ringColor: 0xff2a70,
        planeColor: 0x220215,
        wordColor: "#ff4d88"
      },
      {
        name: "Сакура та Квіти",
        subtitle: "Blossom Valley • Світ 2/3",
        icon: "🌸",
        audioSrc: "track2.mp3", // или music.mp3
        bgFog: 0x0a030c,
        coreColor: 0xff85a2,
        lightColor: 0xff99bb,
        ringColor: 0xffb3c6,
        planeColor: 0x0f291e,
        wordColor: "#ff70a6"
      },
      {
        name: "Захід на Морі",
        subtitle: "Sunset Ocean • Світ 3/3",
        icon: "🌊",
        audioSrc: "track3.mp3", // или music.mp3
        bgFog: 0x040817,
        coreColor: 0xff7700,
        lightColor: 0xffaa00,
        ringColor: 0x00d4ff,
        planeColor: 0x031d38,
        wordColor: "#ff9e00"
      }
    ];

    let currentBiomeIndex = 0;

    const memories = [
      {
        title: "Кохання Мого Життя ❤️",
        desc: "Що більше часу ми разом, то сильніше я тебе кохаю.",
        image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=700"
      },
      {
        title: "Ти Моє Серденько ✨",
        desc: "Якби я міг обрати найбезпечніше місце у світі — це було б поруч із тобою.",
        image: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=700"
      },
      {
        title: "Нескінченність ♾️",
        desc: "У будь-якій галактиці та в кожному житті я знову й знову обираю тебе.",
        image: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=700"
      },
      {
        title: "Ти і Я 🪐",
        desc: "Ти — моя найяскравіша зірка у всьому цьому безмежному всесвіті.",
        image: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=700"
      }
    ];

    let currentMemoryIndex = 0;

    const canvas = document.getElementById('webgl-canvas');
    const startHint = document.getElementById('start-hint');
    const bgMusic = document.getElementById('bg-music');

    const iosPlayer = document.getElementById('ios-player');
    const biomeIcon = document.getElementById('biome-icon');
    const trackTitle = document.getElementById('track-title');
    const trackSubtitle = document.getElementById('track-subtitle');
    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    const cardContainer = document.getElementById('photo-card-container');
    const cardImg = document.getElementById('card-img');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');
    const nextBtn = document.getElementById('next-btn');
    const closeBtn = document.getElementById('close-btn');

    // 1. Сцена и Камера
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000002, 0.007);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 36);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxDistance = 110;
    controls.minDistance = 12;
    controls.target.set(0, 0, 0);
    controls.enabled = false;

    // 2. Фоновые звезды
    const bgStarsGeo = new THREE.BufferGeometry();
    const bgPos = new Float32Array(3000 * 3);
    for (let i = 0; i < 3000 * 3; i++) {
      bgPos[i] = (Math.random() - 0.5) * 260;
    }
    bgStarsGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
    const bgStarsMat = new THREE.PointsMaterial({ color: 0xffaacc, size: 0.35, transparent: true, opacity: 0.75 });
    const bgStars = new THREE.Points(bgStarsGeo, bgStarsMat);
    scene.add(bgStars);

    // Падающие кометы
    const meteors = [];
    for (let i = 0; i < 4; i++) {
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(-6, -3, -4)]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xff6699, transparent: true, opacity: 0 });
      const meteor = new THREE.Line(lineGeo, lineMat);
      scene.add(meteor);
      meteors.push({ mesh: meteor, active: false, timer: Math.random() * 3, speed: 1.8 });
    }

    // 3. СПИРАЛЬ СЛОВ НА СТАРТЕ
    function createLoveWordTex(text, col) {
      const c = document.createElement('canvas');
      c.width = 320; c.height = 80;
      const ctx = c.getContext('2d');
      ctx.font = "bold 34px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = col;
      ctx.shadowColor = col;
      ctx.shadowBlur = 12;
      ctx.fillText(text, 160, 40);
      return new THREE.CanvasTexture(c);
    }

    const wordList = ["Te amo", "I love you", "Кохаю тебе", "Te amo", "Ti amo", "Я тебе кохаю", "Je t'aime"];
    const spiralGroup = new THREE.Group();
    scene.add(spiralGroup);

    const spiralWords = [];
    for (let i = 0; i < 150; i++) {
      const tex = createLoveWordTex(wordList[i % wordList.length], "#ff4d88");
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.98, blending: THREE.AdditiveBlending });
      const sprite = new THREE.Sprite(mat);

      const t = i / 150;
      const angle = t * Math.PI * 14; 
      const radius = 1.2 + Math.pow(t, 1.1) * 24.0;

      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.y = Math.sin(angle) * radius;
      sprite.position.z = 0;

      const scale = 1.8 + t * 4.6;
      sprite.scale.set(scale, scale * 0.25, 1);
      sprite.userData = { baseX: sprite.position.x, baseY: sprite.position.y };

      spiralWords.push(sprite);
      spiralGroup.add(sprite);
    }

    // ==============================================================
    // 4. МИР СЕРДЦА И ГАЛАКТИКИ
    // ==============================================================
    const galaxyWorld = new THREE.Group();
    galaxyWorld.position.set(0, 0, 0);
    galaxyWorld.scale.set(0.001, 0.001, 0.001);
    scene.add(galaxyWorld);

    // ==============================================================
    // ЗАПОЛНЕНИЕ НИЗА: СВЕТЯЩАЯСЯ ВОЛНОВАЯ РЕШЕТКА ПОД ФОТО
    // ==============================================================
    const gridHelper = new THREE.GridHelper(52, 28, 0xff2a70, 0x550a25);
    gridHelper.position.y = -6.5;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.45;
    galaxyWorld.add(gridHelper);

    // Дополнительное кольцо плотного звездного тумана внизу
    const mistGeo = new THREE.BufferGeometry();
    const mistPos = new Float32Array(5000 * 3);
    for (let i = 0; i < 5000; i++) {
      const rad = 14 + Math.random() * 22;
      const ang = Math.random() * Math.PI * 2;
      mistPos[i * 3] = Math.cos(ang) * rad;
      mistPos[i * 3 + 1] = -5.5 + (Math.random() - 0.5) * 3;
      mistPos[i * 3 + 2] = Math.sin(ang) * rad;
    }
    mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPos, 3));
    const mistMat = new THREE.PointsMaterial({
      color: 0xff3377,
      size: 0.28,
      transparent: true,
      opacity: 0.65,
      blending: THREE.AdditiveBlending
    });
    const mistField = new THREE.Points(mistGeo, mistMat);
    galaxyWorld.add(mistField);

    // Спиральная Галактика
    const galaxyCount = 38000;
    const galaxyGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(galaxyCount * 3);
    const colors = new Float32Array(galaxyCount * 3);
    const colorInside = new THREE.Color('#ff2050');
    const colorOutside = new THREE.Color('#2b0014');

    for (let i = 0; i < galaxyCount; i++) {
      const i3 = i * 3;
      const radius = Math.random() * 34;
      const spin = radius * 1.6;
      const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

      const rx = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3 * radius;
      const ry = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.12 * radius;
      const rz = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3 * radius;

      positions[i3] = Math.cos(branchAngle + spin) * radius + rx;
      positions[i3 + 1] = ry - 4.5;
      positions[i3 + 2] = Math.sin(branchAngle + spin) * radius + rz;

      const mixed = colorInside.clone().lerp(colorOutside, radius / 34);
      colors[i3] = mixed.r;
      colors[i3 + 1] = mixed.g;
      colors[i3 + 2] = mixed.b;
    }
    galaxyGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    galaxyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const galaxyMat = new THREE.PointsMaterial({
      size: 0.18,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true
    });
    const galaxy = new THREE.Points(galaxyGeo, galaxyMat);
    galaxyWorld.add(galaxy);

    // Кольца Сатурна
    function createOrbitRing(radiusX, radiusZ, tiltX, tiltZ, colorHex) {
      const pts = [];
      for (let i = 0; i <= 120; i++) {
        const th = (i / 120) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(th) * radiusX, 0, Math.sin(th) * radiusZ));
      }
      const ring = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending })
      );
      ring.rotation.x = tiltX;
      ring.rotation.z = tiltZ;
      return ring;
    }

    const ring1 = createOrbitRing(16, 16, 0.35, 0.25, 0xff2a70);
    ring1.position.y = 5.5;
    galaxyWorld.add(ring1);

    const ring2 = createOrbitRing(19.5, 19.5, -0.3, -0.2, 0xff70a6);
    ring2.position.y = 6.2;
    galaxyWorld.add(ring2);

    // 5. ПЫЛАЮЩИЙ ЦЕНТР СЕРДЦА
    const heartCenterGroup = new THREE.Group();
    galaxyWorld.add(heartCenterGroup);

    const heartLight = new THREE.PointLight(0xff2a6d, 3, 45);
    heartLight.position.set(0, 6.5, 0);
    heartCenterGroup.add(heartLight);

    const coreGeo = new THREE.SphereGeometry(3.2, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xff1450, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending });
    const innerCore = new THREE.Mesh(coreGeo, coreMat);
    innerCore.position.set(0, 6.5, 0);
    heartCenterGroup.add(innerCore);

    const heartCount = 14000;
    const heartGeo = new THREE.BufferGeometry();
    const heartPos = new Float32Array(heartCount * 3);
    const heartColors = new Float32Array(heartCount * 3);

    const colEdge = new THREE.Color('#ff0d55');
    const colInside = new THREE.Color('#ff85a2');
    const colCore = new THREE.Color('#ffffff');

    for (let i = 0; i < heartCount; i++) {
      const i3 = i * 3;
      const t = Math.PI * 2 * Math.random();
      const xBase = 16 * Math.pow(Math.sin(t), 3);
      const yBase = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const fill = Math.pow(Math.random(), 0.6);
      const zDepth = (Math.random() - 0.5) * 8.5 * fill;

      const scale = 0.68 * fill;
      heartPos[i3] = xBase * scale;
      heartPos[i3 + 1] = yBase * scale + 6.5;
      heartPos[i3 + 2] = zDepth;

      let c = colEdge.clone();
      if (fill < 0.4) c.lerp(colCore, 1 - fill / 0.4);
      else c.lerp(colInside, 0.5);

      heartColors[i3] = c.r;
      heartColors[i3 + 1] = c.g;
      heartColors[i3 + 2] = c.b;
    }

    heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

    const heartMat = new THREE.PointsMaterial({
      size: 0.32,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.95,
      depthWrite: false
    });
    const heart = new THREE.Points(heartGeo, heartMat);
    heartCenterGroup.add(heart);

    // Парящие искры
    const embersCount = 450;
    const embersGeo = new THREE.BufferGeometry();
    const embersPos = new Float32Array(embersCount * 3);
    const embersVelocity = [];

    for (let i = 0; i < embersCount; i++) {
      embersPos[i * 3] = (Math.random() - 0.5) * 16;
      embersPos[i * 3 + 1] = 4 + Math.random() * 12;
      embersPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
      embersVelocity.push({ y: 0.03 + Math.random() * 0.04, x: (Math.random() - 0.5) * 0.015, z: (Math.random() - 0.5) * 0.015 });
    }

    embersGeo.setAttribute('position', new THREE.BufferAttribute(embersPos, 3));
    const embersMat = new THREE.PointsMaterial({ color: 0xff70a0, size: 0.45, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.8 });
    const embers = new THREE.Points(embersGeo, embersMat);
    heartCenterGroup.add(embers);

    // Текстовые орбиты
    function createOrbitText(text) {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      c.width = 512; c.height = 128;
      ctx.fillStyle = "rgba(255, 45, 95, 0.95)";
      ctx.shadowColor = "#ff0055";
      ctx.shadowBlur = 18;
      ctx.font = "Bold 34px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(text, 256, 75);

      const tex = new THREE.CanvasTexture(c);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      sprite.scale.set(7.5, 1.85, 1);
      return sprite;
    }

    const words = ["КОХАЮ ТЕБЕ", "НАЗАВЖДИ ∞", "МОЄ СЕРДЕНЬКО", "ВІЧНЕ КОХАННЯ"];
    const labelsGroup = new THREE.Group();
    galaxyWorld.add(labelsGroup);

    words.forEach((w, idx) => {
      const s = createOrbitText(w);
      const angle = (idx / words.length) * Math.PI * 2;
      s.position.set(Math.cos(angle) * 22, -2, Math.sin(angle) * 22);
      labelsGroup.add(s);
    });

    // 6. МЕДАЛЬОНЫ ФОТО И ИХ ШЛЕЙФЫ
    function createMiniBadge(imgUrl, callback) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = imgUrl;
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 160; c.height = 160;
        const ctx = c.getContext('2d');

        ctx.beginPath();
        ctx.arc(80, 80, 70, 0, Math.PI * 2);
        ctx.fillStyle = '#ff2060';
        ctx.shadowColor = '#ff2060';
        ctx.shadowBlur = 15;
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.arc(80, 80, 64, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, 0, 0, 160, 160);
        ctx.restore();

        ctx.beginPath();
        ctx.arc(80, 80, 64, 0, Math.PI * 2);
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.font = '24px sans-serif';
        ctx.fillText('💖', 120, 140);
        callback(new THREE.CanvasTexture(c));
      };
    }

    const miniBadges = [];
    const badgesGroup = new THREE.Group();
    galaxyWorld.add(badgesGroup);

    const trailsGroup = new THREE.Group();
    galaxyWorld.add(trailsGroup);
    const trailsList = [];

    memories.forEach((mem, index) => {
      createMiniBadge(mem.image, (texture) => {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
        sprite.scale.set(2.8, 2.8, 1);

        const angle = (index / memories.length) * Math.PI * 2;
        const radius = 15.5;
        sprite.position.set(Math.cos(angle) * radius, -2.5, Math.sin(angle) * radius);
        sprite.userData = { index: index, baseAngle: angle, radius: radius };
        miniBadges.push(sprite);
        badgesGroup.add(sprite);

        const trailParticles = [];
        for (let j = 0; j < 5; j++) {
          const tSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.35 / (j + 1), blending: THREE.AdditiveBlending }));
          tSprite.scale.set(1.4 - j * 0.18, 1.4 - j * 0.18, 1);
          trailsGroup.add(tSprite);
          trailParticles.push(tSprite);
        }
        trailsList.push({ badge: sprite, particles: trailParticles, history: [] });
      });
    });

    // 7. СИСТЕМА ДИНАМИЧЕСКОЙ СМЕНЫ СЦЕН (БИОМОВ)
    function applyBiome(index) {
      currentBiomeIndex = index;
      const b = biomes[index];

      // Обновление UI плеера
      biomeIcon.textContent = b.icon;
      trackTitle.textContent = b.name;
      trackSubtitle.textContent = b.subtitle;

      // Переключение музыки
      bgMusic.src = b.audioSrc;
      bgMusic.play().catch(e => console.log("Audio switch:", e));
      btnPlay.textContent = "⏸";

      // Смена цветовой гаммы в 3D
      scene.fog.color.setHex(b.bgFog);
      document.body.style.backgroundColor = '#' + b.bgFog.toString(16).padStart(6, '0');
      innerCore.material.color.setHex(b.coreColor);
      heartLight.color.setHex(b.lightColor);
      ring1.material.color.setHex(b.ringColor);
      mistMat.color.setHex(b.lightColor);
      gridHelper.material.color.setHex(b.ringColor);
    }

    btnNext.addEventListener('click', (e) => {
      e.stopPropagation();
      currentBiomeIndex = (currentBiomeIndex + 1) % biomes.length;
      applyBiome(currentBiomeIndex);
    });

    btnPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      currentBiomeIndex = (currentBiomeIndex - 1 + biomes.length) % biomes.length;
      applyBiome(currentBiomeIndex);
    });

    btnPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      if (bgMusic.paused) {
        bgMusic.play();
        btnPlay.textContent = "⏸";
      } else {
        bgMusic.pause();
        btnPlay.textContent = "▶️";
      }
    });

    // Клики по фото и управление модалкой
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let pStartX = 0, pStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      pStartX = e.clientX; pStartY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (!flightActive && flightProgress === 0) {
        startHyperspaceFlight();
        return;
      }

      if (cardContainer.classList.contains('active')) return;
      if (Math.hypot(e.clientX - pStartX, e.clientY - pStartY) > 6) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const badgeHits = raycaster.intersectObjects(miniBadges);
      if (badgeHits.length > 0) {
        showMemory(badgeHits[0].object.userData.index);
      }
    });

    function showMemory(index) {
      currentMemoryIndex = index;
      const data = memories[index];
      cardImg.src = data.image;
      cardTitle.textContent = data.title;
      cardDesc.textContent = data.desc;
      cardContainer.classList.add('active');
    }

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMemoryIndex = (currentMemoryIndex + 1) % memories.length;
      showMemory(currentMemoryIndex);
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      cardContainer.classList.remove('active');
    });

    cardContainer.addEventListener('click', (e) => {
      if (e.target === cardContainer) cardContainer.classList.remove('active');
    });

    // 8. ПЛАВНЫЙ ПРОЛЕТ СКВОЗЬ СПИРАЛЬ
    let flightActive = false;
    let flightProgress = 0;
    const startCamPos = new THREE.Vector3(0, 0, 36);
    const endCamPos = new THREE.Vector3(0, 26, 56);

    function startHyperspaceFlight() {
      flightActive = true;
      startHint.style.opacity = '0';
      setTimeout(() => startHint.remove(), 400);

      // Показываем плеер iOS
      iosPlayer.classList.add('visible');

      applyBiome(0); // Запускаем первую сцену и музыку
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Кометы
      meteors.forEach(m => {
        if (!m.active) {
          m.timer -= 0.016;
          if (m.timer <= 0) {
            m.active = true;
            m.mesh.position.set((Math.random() - 0.5) * 80 + 20, 25 + Math.random() * 20, -30 + (Math.random() - 0.5) * 40);
            m.mesh.material.opacity = 0.8;
          }
        } else {
          m.mesh.position.x -= m.speed;
          m.mesh.position.y -= m.speed * 0.5;
          m.mesh.position.z -= m.speed * 0.6;
          m.mesh.material.opacity -= 0.012;
          if (m.mesh.material.opacity <= 0) {
            m.active = false;
            m.timer = 1.5 + Math.random() * 4;
          }
        }
      });

      // Спираль слов до старта
      if (!flightActive && flightProgress === 0) {
        spiralGroup.rotation.z = -t * 0.16;
      }

      // Полет сквозь спираль
      if (flightActive) {
        flightProgress += 0.012;
        const p = Math.min(flightProgress, 1);
        const ease = p * p * (3 - 2 * p);

        camera.position.x = (1 - ease) * startCamPos.x + ease * endCamPos.x;
        camera.position.y = Math.sin(ease * Math.PI * 0.5) * endCamPos.y;
        camera.position.z = THREE.MathUtils.lerp(startCamPos.z, endCamPos.z, ease);
        camera.lookAt(0, 0, 0);

        spiralGroup.rotation.z -= (0.02 + ease * 0.1);
        spiralWords.forEach(s => {
          s.position.x = s.userData.baseX * (1 + ease * 4.0);
          s.position.y = s.userData.baseY * (1 + ease * 4.0);
          s.material.opacity = Math.max(0, 0.98 - ease * 1.3);
        });

        galaxyWorld.scale.set(ease, ease, ease);
        galaxy.rotation.y += (1 - p) * 0.08;

        if (p >= 1) {
          flightActive = false;
          scene.remove(spiralGroup);
          controls.enabled = true;
        }
      }

      // Жизнь мира
      if (flightProgress >= 1) {
        galaxy.rotation.y += 0.002;
        labelsGroup.rotation.y = -t * 0.08;
        gridHelper.rotation.y = t * 0.015;
        mistField.rotation.y = -t * 0.02;

        ring1.rotation.y = t * 0.05;
        ring2.rotation.y = -t * 0.04;

        miniBadges.forEach((b, i) => {
          const curAngle = b.userData.baseAngle + t * 0.1;
          b.position.x = Math.cos(curAngle) * b.userData.radius;
          b.position.z = Math.sin(curAngle) * b.userData.radius;
          b.position.y = -2.5 + Math.sin(t * 2 + i) * 0.4;
        });

        trailsList.forEach(trail => {
          trail.history.unshift(trail.badge.position.clone());
          if (trail.history.length > 25) trail.history.pop();
          trail.particles.forEach((p, idx) => {
            const hIdx = (idx + 1) * 3;
            if (trail.history[hIdx]) p.position.copy(trail.history[hIdx]);
          });
        });

        const beat = 1 + Math.sin(t * 3.4) * 0.07;
        heart.scale.set(beat, beat, beat);
        innerCore.scale.set(beat * 1.1, beat * 1.1, beat * 1.1);
        heartLight.intensity = 2.5 + Math.sin(t * 3.4) * 1.5;

        // Полет искр
        const posAttr = embersGeo.attributes.position;
        for (let i = 0; i < embersCount; i++) {
          posAttr.array[i * 3 + 1] += embersVelocity[i].y;
          posAttr.array[i * 3] += embersVelocity[i].x;
          posAttr.array[i * 3 + 2] += embersVelocity[i].z;

          if (posAttr.array[i * 3 + 1] > 18) {
            posAttr.array[i * 3 + 1] = 3.5;
            posAttr.array[i * 3] = (Math.random() - 0.5) * 10;
            posAttr.array[i * 3 + 2] = (Math.random() - 0.5) * 8;
          }
        }
        posAttr.needsUpdate = true;

        controls.update();
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
