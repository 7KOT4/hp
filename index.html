<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Світи Нашого Кохання ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #010003;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      color: #fff;
      transition: background-color 1.2s ease;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* Градиент неба для локаций */
    #sky-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      transition: background 1.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.5s ease;
      background: radial-gradient(circle at center, #0a0108 0%, #010003 100%);
    }

    /* iOS Dynamic Island Player */
    #ios-player {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      z-index: 50;
      background: rgba(18, 18, 24, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(35px) saturate(200%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 42, 95, 0.25);
      border-radius: 40px;
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 335px;
      max-width: 92vw;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s ease;
      opacity: 0;
    }

    #ios-player.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .player-cover {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 18px rgba(255, 42, 95, 0.5);
      flex-shrink: 0;
    }

    .player-info {
      flex: 1;
      overflow: hidden;
    }

    .player-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-subtitle {
      font-size: 0.74rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 2px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: transform 0.15s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.82);
    }

    .ctrl-btn.play {
      background: rgba(255, 255, 255, 0.16);
      font-size: 0.95rem;
    }

    /* Подсказка старта */
    #start-hint {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      font-size: 0.82rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      color: rgba(255, 185, 215, 0.9);
      background: rgba(18, 2, 10, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 11px 26px;
      border-radius: 30px;
      border: 1px solid rgba(255, 77, 109, 0.35);
      box-shadow: 0 0 30px rgba(255, 42, 95, 0.3);
      pointer-events: none;
      animation: pulseHint 2.4s infinite ease-in-out;
      transition: opacity 0.5s ease;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(0.97); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.02); }
    }

    /* Карточка фото */
    #photo-card-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 60;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      background: radial-gradient(circle at center, rgba(30, 2, 14, 0.65) 0%, rgba(0, 0, 0, 0.88) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #photo-card-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .memory-card {
      background: rgba(16, 2, 8, 0.92);
      border: 1px solid rgba(255, 64, 129, 0.5);
      box-shadow: 0 0 60px rgba(255, 30, 90, 0.45);
      border-radius: 28px;
      padding: 22px 20px;
      max-width: 325px;
      width: 86%;
      text-align: center;
      transform: scale(0.7) translateY(40px);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #photo-card-container.active .memory-card {
      transform: scale(1) translateY(0);
    }

    .memory-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      margin-bottom: 14px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    .memory-card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ff4d6d;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.5);
    }

    .memory-card p {
      font-size: 0.92rem;
      color: #e5d4dd;
      line-height: 1.45;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .card-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 77, 109, 0.35);
      color: #fff;
      font-size: 0.88rem;
      padding: 9px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s all;
    }

    .btn-action.next {
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      border: none;
      box-shadow: 0 0 18px rgba(255, 42, 95, 0.55);
    }

    .btn-action:hover {
      transform: scale(1.05);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Фон неба под WebGL (динамически меняется под локацию) -->
  <div id="sky-backdrop"></div>

  <audio id="bg-music" loop preload="auto"></audio>

  <!-- iOS Плеер -->
  <div id="ios-player">
    <div class="player-cover" id="biome-icon">🌌</div>
    <div class="player-info">
      <div class="player-title" id="track-title">Космос Кохання</div>
      <div class="player-subtitle" id="track-subtitle">Galaxy Love • Світ 1/3</div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" id="btn-prev">⏮</button>
      <button class="ctrl-btn play" id="btn-play">⏸</button>
      <button class="ctrl-btn" id="btn-next">⏭</button>
    </div>
  </div>

  <div id="start-hint">ТОРКНІТЬСЯ ЕКРАНА, ЩОБ РОЗПОЧАТИ ПОДОРОЖ</div>

  <!-- Модалка воспоминаний -->
  <div id="photo-card-container">
    <div class="memory-card">
      <img id="card-img" src="" alt="Спогад">
      <h2 id="card-title"></h2>
      <p id="card-desc"></p>
      <div class="card-actions">
        <button class="btn-action next" id="next-btn">ДАЛІ 💌</button>
        <button class="btn-action" id="close-btn">ЗАКРИТИ ✕</button>
      </div>
    </div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    // ==============================================================
    // 3 КАРДИНАЛЬНО РАЗНЫЕ ЛОКАЦИИ (РАЗНОЕ НЕБО, ОСВЕЩЕНИЕ, МИРЫ)
    // ==============================================================
    const biomes = [
      {
        name: "Космос Кохання",
        subtitle: "Galaxy Love • Світ 1/3",
        icon: "🌌",
        audioSrc: "music.mp3",
        skyGradient: "radial-gradient(circle at center, #0a0108 0%, #010003 100%)",
        fogColor: 0x010003,
        ambientColor: 0x331122,
        lightColor: 0xff2a6d,
        coreColor: 0xff1450
      },
      {
        name: "Сад Сакури на Світанку",
        subtitle: "Sakura Garden • Світ 2/3",
        icon: "🌸",
        audioSrc: "track2.mp3",
        // Нежное перламутровое небо рассвета
        skyGradient: "linear-gradient(180deg, #3d1c3a 0%, #7b3866 35%, #d87d96 65%, #ffccd5 100%)",
        fogColor: 0x7b3866,
        ambientColor: 0x884466,
        lightColor: 0xff99bb,
        coreColor: 0xff4d88
      },
      {
        name: "Захід Сонця над Океаном",
        subtitle: "Sunset Ocean • Світ 3/3",
        icon: "🌊",
        audioSrc: "track3.mp3",
        // Глубокий закатный горизонт (манго, пурпур, океан)
        skyGradient: "linear-gradient(180deg, #12032b 0%, #3a0d45 30%, #872341 55%, #e25822 75%, #fca311 100%)",
        fogColor: 0x3a0d45,
        ambientColor: 0x552211,
        lightColor: 0xff8c00,
        coreColor: 0xff3b00
      }
    ];

    let currentBiomeIndex = 0;

    const memories = [
      {
        title: "Кохання Мого Життя ❤️",
        desc: "Що більше часу ми разом, то сильніше я тебе кохаю.",
        image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=700"
      },
      {
        title: "Ти Моє Серденько ✨",
        desc: "Якби я міг обрати найбезпечніше місце у світі — це було б поруч із тобою.",
        image: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=700"
      },
      {
        title: "Нескінченність ♾️",
        desc: "У будь-якій галактиці та в кожному житті я знову й знову обираю тебе.",
        image: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=700"
      },
      {
        title: "Ти і Я 🪐",
        desc: "Ти — моя найяскравіша зірка у всьому цьому безмежному всесвіті.",
        image: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=700"
      }
    ];

    let currentMemoryIndex = 0;

    const canvas = document.getElementById('webgl-canvas');
    const skyBackdrop = document.getElementById('sky-backdrop');
    const startHint = document.getElementById('start-hint');
    const bgMusic = document.getElementById('bg-music');

    const iosPlayer = document.getElementById('ios-player');
    const biomeIcon = document.getElementById('biome-icon');
    const trackTitle = document.getElementById('track-title');
    const trackSubtitle = document.getElementById('track-subtitle');
    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    const cardContainer = document.getElementById('photo-card-container');
    const cardImg = document.getElementById('card-img');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');
    const nextBtn = document.getElementById('next-btn');
    const closeBtn = document.getElementById('close-btn');

    // Текстура мягкого сияния (убирает пиксели)
    function createGlowTexture() {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.3, 'rgba(255, 80, 140, 0.85)');
      grad.addColorStop(0.7, 'rgba(255, 20, 80, 0.15)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }
    const glowTex = createGlowTexture();

    // 1. Сцена и Камера
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010003, 0.007);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 36);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxDistance = 110;
    controls.minDistance = 12;
    controls.target.set(0, 0, 0);
    controls.enabled = false;

    // ==============================================================
    // 2. СПИРАЛЬ СЛОВ (ВОРОНКА TLANEX)
    // ==============================================================
    function createLoveWordTex(text) {
      const c = document.createElement('canvas');
      c.width = 340; c.height = 84;
      const ctx = c.getContext('2d');
      ctx.font = "bold 34px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 14;
      ctx.fillStyle = "#ff4d88";
      ctx.fillText(text, 170, 42);
      return new THREE.CanvasTexture(c);
    }

    const wordList = ["Te amo", "I love you", "Кохаю тебе", "Te amo", "Ti amo", "Я тебе кохаю", "Je t'aime"];
    const spiralGroup = new THREE.Group();
    scene.add(spiralGroup);
    const spiralWords = [];

    for (let i = 0; i < 150; i++) {
      const tex = createLoveWordTex(wordList[i % wordList.length]);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.98, blending: THREE.AdditiveBlending });
      const sprite = new THREE.Sprite(mat);
      const t = i / 150;
      const angle = t * Math.PI * 14; 
      const radius = 1.2 + Math.pow(t, 1.1) * 24.0;
      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.y = Math.sin(angle) * radius;
      sprite.position.z = 0;
      const scale = 1.8 + t * 4.6;
      sprite.scale.set(scale, scale * 0.25, 1);
      sprite.userData = { baseX: sprite.position.x, baseY: sprite.position.y };
      spiralWords.push(sprite);
      spiralGroup.add(sprite);
    }

    // ==============================================================
    // 3. СЕРДЦЕ И ФОТО (ЕДИНЫЙ ЦЕНТР ДЛЯ ВСЕХ ЛОКАЦИЙ)
    // ==============================================================
    const heartCenterGroup = new THREE.Group();
    scene.add(heartCenterGroup);
    heartCenterGroup.scale.set(0.001, 0.001, 0.001);

    const heartLight = new THREE.PointLight(0xff2a6d, 3.8, 55);
    heartLight.position.set(0, 6.5, 0);
    heartCenterGroup.add(heartLight);

    const coreGeo = new THREE.SphereGeometry(3.2, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xff1450, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
    const innerCore = new THREE.Mesh(coreGeo, coreMat);
    innerCore.position.set(0, 6.5, 0);
    heartCenterGroup.add(innerCore);

    // 14 000 частиц плотного сердца
    const heartCount = 14000;
    const heartGeo = new THREE.BufferGeometry();
    const heartPos = new Float32Array(heartCount * 3);
    const heartColors = new Float32Array(heartCount * 3);
    const colEdge = new THREE.Color('#ff0d55');
    const colInside = new THREE.Color('#ff85a2');
    const colCore = new THREE.Color('#ffffff');

    for (let i = 0; i < heartCount; i++) {
      const i3 = i * 3;
      const t = Math.PI * 2 * Math.random();
      const xBase = 16 * Math.pow(Math.sin(t), 3);
      const yBase = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const fill = Math.pow(Math.random(), 0.6);
      const zDepth = (Math.random() - 0.5) * 8.5 * fill;

      const scale = 0.68 * fill;
      heartPos[i3] = xBase * scale;
      heartPos[i3 + 1] = yBase * scale + 6.5;
      heartPos[i3 + 2] = zDepth;

      let c = colEdge.clone();
      if (fill < 0.4) c.lerp(colCore, 1 - fill / 0.4);
      else c.lerp(colInside, 0.5);

      heartColors[i3] = c.r; heartColors[i3 + 1] = c.g; heartColors[i3 + 2] = c.b;
    }
    heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));
    const heart = new THREE.Points(heartGeo, new THREE.PointsMaterial({
      size: 0.55,
      map: glowTex,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.95,
      depthWrite: false
    }));
    heartCenterGroup.add(heart);

    // Искры от сердца
    const embersCount = 450;
    const embersGeo = new THREE.BufferGeometry();
    const embersPos = new Float32Array(embersCount * 3);
    const embersVelocity = [];
    for (let i = 0; i < embersCount; i++) {
      embersPos[i * 3] = (Math.random() - 0.5) * 16;
      embersPos[i * 3 + 1] = 4 + Math.random() * 12;
      embersPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
      embersVelocity.push({ y: 0.03 + Math.random() * 0.04, x: (Math.random() - 0.5) * 0.015, z: (Math.random() - 0.5) * 0.015 });
    }
    embersGeo.setAttribute('position', new THREE.BufferAttribute(embersPos, 3));
    const embers = new THREE.Points(embersGeo, new THREE.PointsMaterial({
      color: 0xff70a0,
      size: 0.65,
      map: glowTex,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.85,
      depthWrite: false
    }));
    heartCenterGroup.add(embers);

    // Фото-медальоны
    function createMiniBadge(imgUrl, callback) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = imgUrl;
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 180; c.height = 180;
        const ctx = c.getContext('2d');
        ctx.beginPath(); ctx.arc(90, 90, 78, 0, Math.PI * 2);
        ctx.fillStyle = '#ff2060'; ctx.shadowColor = '#ff2060'; ctx.shadowBlur = 18; ctx.fill();
        ctx.save(); ctx.beginPath(); ctx.arc(90, 90, 70, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(img, 0, 0, 180, 180); ctx.restore();
        ctx.beginPath(); ctx.arc(90, 90, 70, 0, Math.PI * 2); ctx.lineWidth = 6; ctx.strokeStyle = '#ffffff'; ctx.stroke();
        ctx.font = '26px sans-serif'; ctx.fillText('💖', 135, 155);
        callback(new THREE.CanvasTexture(c));
      };
    }

    const miniBadges = [];
    const badgesGroup = new THREE.Group();
    scene.add(badgesGroup);
    badgesGroup.scale.set(0.001, 0.001, 0.001);

    memories.forEach((mem, index) => {
      createMiniBadge(mem.image, (texture) => {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
        sprite.scale.set(2.8, 2.8, 1);
        const angle = (index / memories.length) * Math.PI * 2;
        const radius = 16.5;
        sprite.position.set(Math.cos(angle) * radius, -2.5, Math.sin(angle) * radius);
        sprite.userData = { index: index, baseAngle: angle, radius: radius };
        miniBadges.push(sprite);
        badgesGroup.add(sprite);
      });
    });

    // ==============================================================
    // 4. ТРИ УНИКАЛЬНЫХ ПОЛНОЦЕННЫХ МИРА
    // ==============================================================

    // --------------------------------------------------------------
    // МИР 1: КОСМОС (Черная дыра, аккреционный диск, звезды, кометы)
    // --------------------------------------------------------------
    const spaceGroup = new THREE.Group();
    scene.add(spaceGroup);
    spaceGroup.scale.set(0.001, 0.001, 0.001);

    // Звезды космоса (только для мира 1)
    const spaceStarsGeo = new THREE.BufferGeometry();
    const sPos = new Float32Array(3000 * 3);
    for (let i = 0; i < 3000 * 3; i++) sPos[i] = (Math.random() - 0.5) * 260;
    spaceStarsGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
    const spaceStars = new THREE.Points(spaceStarsGeo, new THREE.PointsMaterial({
      color: 0xffb3c6, size: 0.6, map: glowTex, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    spaceGroup.add(spaceStars);

    // Черная дыра
    const blackHole = new THREE.Mesh(new THREE.SphereGeometry(3.4, 32, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
    spaceGroup.add(blackHole);

    // Фотонное кольцо
    const photonRing = new THREE.Mesh(
      new THREE.RingGeometry(3.4, 4.2, 48),
      new THREE.MeshBasicMaterial({ color: 0xff1450, side: THREE.DoubleSide, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending })
    );
    photonRing.rotation.x = Math.PI / 2;
    spaceGroup.add(photonRing);

    // Галактический аккреционный диск
    const galaxyCount = 42000;
    const galaxyGeo = new THREE.BufferGeometry();
    const gPositions = new Float32Array(galaxyCount * 3);
    const gColors = new Float32Array(galaxyCount * 3);
    const cIn = new THREE.Color('#ff2060');
    const cOut = new THREE.Color('#220010');

    for (let i = 0; i < galaxyCount; i++) {
      const i3 = i * 3;
      const radius = 3.8 + Math.pow(Math.random(), 1.4) * 32;
      const spin = radius * 1.7;
      const branchAngle = ((i % 3) * 2 * Math.PI) / 3;
      const rx = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.28 * radius;
      const ry = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.1 * radius;
      const rz = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.28 * radius;

      gPositions[i3] = Math.cos(branchAngle + spin) * radius + rx;
      gPositions[i3 + 1] = ry - 4.5;
      gPositions[i3 + 2] = Math.sin(branchAngle + spin) * radius + rz;

      const mixed = cIn.clone().lerp(cOut, (radius - 3.8) / 32);
      gColors[i3] = mixed.r; gColors[i3 + 1] = mixed.g; gColors[i3 + 2] = mixed.b;
    }
    galaxyGeo.setAttribute('position', new THREE.BufferAttribute(gPositions, 3));
    galaxyGeo.setAttribute('color', new THREE.BufferAttribute(gColors, 3));
    const galaxy = new THREE.Points(galaxyGeo, new THREE.PointsMaterial({
      size: 0.45, map: glowTex, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
    }));
    spaceGroup.add(galaxy);

    // --------------------------------------------------------------
    // МИР 2: САД САКУРЫ (Светлое небо, туманный ковер, падающие лепестки)
    // --------------------------------------------------------------
    const sakuraGroup = new THREE.Group();
    scene.add(sakuraGroup);
    sakuraGroup.visible = false;

    // Мягкое утреннее солнце сада
    const sakuraSun = new THREE.Mesh(
      new THREE.CircleGeometry(16, 48),
      new THREE.MeshBasicMaterial({ color: 0xffd1dc, transparent: true, opacity: 0.55 })
    );
    sakuraSun.position.set(0, 10, -42);
    sakuraGroup.add(sakuraSun);

    // Шелковистый утренний туман внизу
    const fogFloorGeo = new THREE.BufferGeometry();
    const fogFloorPos = new Float32Array(7000 * 3);
    for (let i = 0; i < 7000; i++) {
      const rad = 2 + Math.pow(Math.random(), 0.7) * 36;
      const ang = Math.random() * Math.PI * 2;
      fogFloorPos[i * 3] = Math.cos(ang) * rad;
      fogFloorPos[i * 3 + 1] = -5.8 + (Math.random() - 0.5) * 1.5;
      fogFloorPos[i * 3 + 2] = Math.sin(ang) * rad;
    }
    fogFloorGeo.setAttribute('position', new THREE.BufferAttribute(fogFloorPos, 3));
    const fogFloor = new THREE.Points(fogFloorGeo, new THREE.PointsMaterial({
      color: 0xffccd5, size: 0.9, map: glowTex, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    sakuraGroup.add(fogFloor);

    // 3000 падающих и кружащихся лепестков сакуры
    const petalsCount = 3000;
    const petalsGeo = new THREE.BufferGeometry();
    const petalsPos = new Float32Array(petalsCount * 3);
    const petalsVel = [];
    for (let i = 0; i < petalsCount; i++) {
      petalsPos[i * 3] = (Math.random() - 0.5) * 60;
      petalsPos[i * 3 + 1] = -5 + Math.random() * 32;
      petalsPos[i * 3 + 2] = (Math.random() - 0.5) * 60;
      petalsVel.push({
        x: (Math.random() - 0.5) * 0.06,
        y: -0.02 - Math.random() * 0.03,
        z: (Math.random() - 0.5) * 0.06
      });
    }
    petalsGeo.setAttribute('position', new THREE.BufferAttribute(petalsPos, 3));
    const petalsField = new THREE.Points(petalsGeo, new THREE.PointsMaterial({
      color: 0xff9ebb, size: 0.85, map: glowTex, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    sakuraGroup.add(petalsField);

    // --------------------------------------------------------------
    // МИР 3: ЗАХОД НА ОКЕАНЕ (Закатное солнце, гладь воды с волнами)
    // --------------------------------------------------------------
    const oceanGroup = new THREE.Group();
    scene.add(oceanGroup);
    oceanGroup.visible = false;

    // Пылающее закатное солнце на горизонте
    const sunsetSun = new THREE.Mesh(
      new THREE.CircleGeometry(22, 64),
      new THREE.MeshBasicMaterial({ color: 0xff6b35, transparent: true, opacity: 0.75 })
    );
    sunsetSun.position.set(0, 4, -48);
    oceanGroup.add(sunsetSun);

    // Сияющий солнечный диск (ядро)
    const sunInner = new THREE.Mesh(
      new THREE.CircleGeometry(12, 48),
      new THREE.MeshBasicMaterial({ color: 0xffd000, transparent: true, opacity: 0.85 })
    );
    sunInner.position.set(0, 4, -47.8);
    oceanGroup.add(sunInner);

    // Океан: водная гладь из 8000 отражающих закатных бликов
    const oceanSparksCount = 9000;
    const oceanSparksGeo = new THREE.BufferGeometry();
    const oceanSparksPos = new Float32Array(oceanSparksCount * 3);
    const oceanOriginals = [];

    for (let i = 0; i < oceanSparksCount; i++) {
      const x = (Math.random() - 0.5) * 75;
      const z = (Math.random() - 0.5) * 75;
      const y = -6.2;
      oceanSparksPos[i * 3] = x;
      oceanSparksPos[i * 3 + 1] = y;
      oceanSparksPos[i * 3 + 2] = z;
      oceanOriginals.push({ x: x, y: y, z: z, phase: Math.random() * Math.PI * 2 });
    }
    oceanSparksGeo.setAttribute('position', new THREE.BufferAttribute(oceanSparksPos, 3));
    const oceanWater = new THREE.Points(oceanSparksGeo, new THREE.PointsMaterial({
      color: 0xffaa00, size: 0.75, map: glowTex, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    oceanGroup.add(oceanWater);

    // ==============================================================
    // 5. ПЕРЕКЛЮЧЕНИЕ МИРОВ И МУЗЫКИ
    // ==============================================================
    function switchBiome(index) {
      currentBiomeIndex = index;
      const b = biomes[index];

      // UI плеера
      biomeIcon.textContent = b.icon;
      trackTitle.textContent = b.name;
      trackSubtitle.textContent = b.subtitle;

      // Музыка
      bgMusic.src = b.audioSrc;
      bgMusic.play().catch(() => {
        bgMusic.src = "music.mp3";
        bgMusic.play().catch(() => {});
      });
      btnPlay.textContent = "⏸";

      // Кардинальная смена неба и тумана
      skyBackdrop.style.background = b.skyGradient;
      scene.fog.color.setHex(b.fogColor);

      // Настройка цвета освещения
      innerCore.material.color.setHex(b.coreColor);
      heartLight.color.setHex(b.lightColor);

      // Полное отключение ненужных локаций
      spaceGroup.visible = (index === 0);
      sakuraGroup.visible = (index === 1);
      oceanGroup.visible = (index === 2);
    }

    btnNext.addEventListener('click', (e) => {
      e.stopPropagation();
      currentBiomeIndex = (currentBiomeIndex + 1) % biomes.length;
      switchBiome(currentBiomeIndex);
    });

    btnPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      currentBiomeIndex = (currentBiomeIndex - 1 + biomes.length) % biomes.length;
      switchBiome(currentBiomeIndex);
    });

    btnPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      if (bgMusic.paused) {
        bgMusic.play();
        btnPlay.textContent = "⏸";
      } else {
        bgMusic.pause();
        btnPlay.textContent = "▶️";
      }
    });

    // Клики по фото
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let pStartX = 0, pStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      pStartX = e.clientX; pStartY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (!flightActive && flightProgress === 0) {
        startHyperspaceFlight();
        return;
      }
      if (cardContainer.classList.contains('active')) return;
      if (Math.hypot(e.clientX - pStartX, e.clientY - pStartY) > 6) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(miniBadges);
      if (hits.length > 0) showMemory(hits[0].object.userData.index);
    });

    function showMemory(index) {
      currentMemoryIndex = index;
      const data = memories[index];
      cardImg.src = data.image; cardTitle.textContent = data.title; cardDesc.textContent = data.desc;
      cardContainer.classList.add('active');
    }

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMemoryIndex = (currentMemoryIndex + 1) % memories.length;
      showMemory(currentMemoryIndex);
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      cardContainer.classList.remove('active');
    });

    cardContainer.addEventListener('click', (e) => {
      if (e.target === cardContainer) cardContainer.classList.remove('active');
    });

    // ==============================================================
    // 6. СТАРТ И ПРОЛЕТ СКВОЗЬ СПИРАЛЬ
    // ==============================================================
    let flightActive = false;
    let flightProgress = 0;
    const startCamPos = new THREE.Vector3(0, 0, 36);
    const endCamPos = new THREE.Vector3(0, 26, 56);

    function startHyperspaceFlight() {
      flightActive = true;
      startHint.style.opacity = '0';
      setTimeout(() => startHint.remove(), 400);

      iosPlayer.classList.add('visible');
      switchBiome(0); // Стартуем в космосе
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Спираль слов до старта
      if (!flightActive && flightProgress === 0) {
        spiralGroup.rotation.z = -t * 0.16;
      }

      // Полет
      if (flightActive) {
        flightProgress += 0.012;
        const p = Math.min(flightProgress, 1);
        const ease = p * p * (3 - 2 * p);

        camera.position.x = (1 - ease) * startCamPos.x + ease * endCamPos.x;
        camera.position.y = Math.sin(ease * Math.PI * 0.5) * endCamPos.y;
        camera.position.z = THREE.MathUtils.lerp(startCamPos.z, endCamPos.z, ease);
        camera.lookAt(0, 0, 0);

        spiralGroup.rotation.z -= (0.02 + ease * 0.1);
        spiralWords.forEach(s => {
          s.position.x = s.userData.baseX * (1 + ease * 4.0);
          s.position.y = s.userData.baseY * (1 + ease * 4.0);
          s.material.opacity = Math.max(0, 0.98 - ease * 1.3);
        });

        heartCenterGroup.scale.set(ease, ease, ease);
        spaceGroup.scale.set(ease, ease, ease);
        badgesGroup.scale.set(ease, ease, ease);

        if (p >= 1) {
          flightActive = false;
          scene.remove(spiralGroup);
          controls.enabled = true;
        }
      }

      // Жизнь активного мира
      if (flightProgress >= 1) {
        // Сердце бьется в центре во всех мирах
        const beat = 1 + Math.sin(t * 3.4) * 0.07;
        heart.scale.set(beat, beat, beat);
        innerCore.scale.set(beat * 1.1, beat * 1.1, beat * 1.1);
        heartLight.intensity = 2.8 + Math.sin(t * 3.4) * 1.5;

        // Парящие искры от сердца
        const posAttr = embersGeo.attributes.position;
        for (let i = 0; i < embersCount; i++) {
          posAttr.array[i * 3 + 1] += embersVelocity[i].y;
          posAttr.array[i * 3] += embersVelocity[i].x;
          posAttr.array[i * 3 + 2] += embersVelocity[i].z;
          if (posAttr.array[i * 3 + 1] > 18) {
            posAttr.array[i * 3 + 1] = 3.5;
            posAttr.array[i * 3] = (Math.random() - 0.5) * 10;
            posAttr.array[i * 3 + 2] = (Math.random() - 0.5) * 8;
          }
        }
        embersGeo.needsUpdate = true;

        // Вращение фото-медальонов вокруг сердца
        miniBadges.forEach((b, i) => {
          const curAngle = b.userData.baseAngle + t * 0.1;
          b.position.x = Math.cos(curAngle) * b.userData.radius;
          b.position.z = Math.sin(curAngle) * b.userData.radius;
          b.position.y = -2.5 + Math.sin(t * 2 + i) * 0.4;
        });

        // 1. Анимация Космоса
        if (spaceGroup.visible) {
          galaxy.rotation.y += 0.002;
          photonRing.rotation.z += 0.01;
        }

        // 2. Анимация Сакуры (лепестки плавно кружатся и падают)
        if (sakuraGroup.visible) {
          const pPos = petalsGeo.attributes.position;
          for (let i = 0; i < petalsCount; i++) {
            pPos.array[i * 3] += petalsVel[i].x + Math.sin(t + i) * 0.02;
            pPos.array[i * 3 + 1] += petalsVel[i].y;
            pPos.array[i * 3 + 2] += petalsVel[i].z + Math.cos(t + i) * 0.02;

            if (pPos.array[i * 3 + 1] < -6) {
              pPos.array[i * 3 + 1] = 24;
              pPos.array[i * 3] = (Math.random() - 0.5) * 60;
              pPos.array[i * 3 + 2] = (Math.random() - 0.5) * 60;
            }
          }
          petalsGeo.needsUpdate = true;
          fogFloor.rotation.y = t * 0.005;
        }

        // 3. Анимация Океана (живые 3D-волны на закате)
        if (oceanGroup.visible) {
          const wPos = oceanSparksGeo.attributes.position;
          for (let i = 0; i < oceanSparksCount; i++) {
            const org = oceanOriginals[i];
            const wave = Math.sin(org.x * 0.2 + t * 2.5 + org.phase) * 0.5 + Math.cos(org.z * 0.2 + t * 2.0) * 0.4;
            wPos.array[i * 3 + 1] = org.y + wave;
          }
          oceanSparksGeo.needsUpdate = true;
        }

        controls.update();
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
