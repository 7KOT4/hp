<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Love ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030005;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* Стартовый экран */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #260212 0%, #030005 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .card-start {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 77, 109, 0.35);
      padding: 35px 25px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 10px 45px rgba(255, 20, 90, 0.25);
      max-width: 320px;
      width: 85%;
    }

    .title {
      font-size: 2.1rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 18px rgba(255, 77, 109, 0.8);
      margin-bottom: 15px;
    }

    .mascot {
      font-size: 70px;
      margin: 15px 0 25px 0;
      animation: float 2.5s ease-in-out infinite alternate;
      display: inline-block;
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-10px) scale(1.05); }
    }

    .btn-start {
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      border: none;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 14px 38px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 42, 95, 0.65);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(255, 42, 95, 0.9);
    }

    /* Модальное окно при клике на летающее фото */
    #photo-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #photo-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .photo-card {
      background: rgba(22, 3, 10, 0.92);
      border: 1px solid rgba(255, 64, 129, 0.5);
      box-shadow: 0 0 40px rgba(255, 64, 129, 0.4);
      border-radius: 24px;
      padding: 22px;
      max-width: 340px;
      width: 88%;
      text-align: center;
      transform: scale(0.85);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #photo-modal-overlay.active .photo-card {
      transform: scale(1);
    }

    .photo-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 16px;
    }

    .photo-card h3 {
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: #ff4d6d;
    }

    .photo-card p {
      font-size: 0.98rem;
      color: #f1e6eb;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 0.95rem;
      padding: 8px 24px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s background;
    }

    .btn-close:hover {
      background: rgba(255, 64, 129, 0.3);
    }

    .hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>

  <!-- Three.js и OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Фоновая музыка -->
  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

  <!-- Стартовый экран -->
  <div id="start-screen">
    <div class="card-start">
      <h1 class="title">Galaxy Love</h1>
      <div class="mascot">🐰🤍🐱</div>
      <button class="btn-start" id="start-btn">
        INICIAR 💌
      </button>
    </div>
  </div>

  <!-- Модальное окно для показа фото с подписью -->
  <div id="photo-modal-overlay">
    <div class="photo-card">
      <img id="card-img" src="" alt="Memory">
      <h3 id="card-title"></h3>
      <p id="card-desc"></p>
      <button class="btn-close" id="close-modal-btn">CERRAR ✕</button>
    </div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    // ==========================================
    // НАСТРОЙКА ФОТО И ПОДПИСЕЙ
    // Можешь добавить сколько угодно элементов!
    // ==========================================
    const memories = [
      {
        title: "Amor de mi Vida",
        desc: "Cada segundo a tu lado es un regalo que cuido con todo mi corazón.",
        image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600" // Замени на свое фото (например 'photo1.jpg')
      },
      {
        title: "Me Encantas",
        desc: "Si pudiera elegir un lugar seguro, sería siempre a tu lado.",
        image: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=600"
      },
      {
        title: "Infinito Amor ♾️",
        desc: "Hasta el final de las estrellas y mucho más allá.",
        image: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=600"
      },
      {
        title: "Juntos Por Siempre",
        desc: "Tú haces que todo en mi universo tenga un sentido especial.",
        image: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=600"
      }
    ];

    // Three.js сцена
    const canvas = document.getElementById('webgl-canvas');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    const modalOverlay = document.getElementById('photo-modal-overlay');
    const cardImg = document.getElementById('card-img');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');
    const closeModalBtn = document.getElementById('close-modal-btn');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030005, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 28, 62);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 110;
    controls.minDistance = 15;

    // 1. Фоновые звезды
    const bgStarsGeo = new THREE.BufferGeometry();
    const bgPos = new Float32Array(2000 * 3);
    for (let i = 0; i < 2000 * 3; i++) {
      bgPos[i] = (Math.random() - 0.5) * 220;
    }
    bgStarsGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
    const bgStarsMat = new THREE.PointsMaterial({ color: 0xffb3c6, size: 0.35, transparent: true, opacity: 0.75 });
    scene.add(new THREE.Points(bgStarsGeo, bgStarsMat));

    // 2. Спиральная Галактика
    const galaxyCount = 38000;
    const galaxyGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(galaxyCount * 3);
    const colors = new Float32Array(galaxyCount * 3);
    const colorIn = new THREE.Color('#ff2050');
    const colorOut = new THREE.Color('#330018');

    for (let i = 0; i < galaxyCount; i++) {
      const i3 = i * 3;
      const radius = Math.random() * 36;
      const spin = radius * 1.5;
      const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

      const rx = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.35 * radius;
      const ry = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.15 * radius;
      const rz = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.35 * radius;

      positions[i3] = Math.cos(branchAngle + spin) * radius + rx;
      positions[i3 + 1] = ry - 5;
      positions[i3 + 2] = Math.sin(branchAngle + spin) * radius + rz;

      const mixed = colorIn.clone().lerp(colorOut, radius / 36);
      colors[i3] = mixed.r;
      colors[i3 + 1] = mixed.g;
      colors[i3 + 2] = mixed.b;
    }
    galaxyGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    galaxyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const galaxyMat = new THREE.PointsMaterial({
      size: 0.18,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true
    });
    const galaxy = new THREE.Points(galaxyGeo, galaxyMat);
    scene.add(galaxy);

    // 3. Сердце из светящихся частиц
    const heartCount = 6500;
    const heartGeo = new THREE.BufferGeometry();
    const heartPos = new Float32Array(heartCount * 3);

    for (let i = 0; i < heartCount; i++) {
      const i3 = i * 3;
      const t = Math.PI * 2 * Math.random();
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const z = (Math.random() - 0.5) * 8;
      const scale = 0.65;

      heartPos[i3] = x * scale;
      heartPos[i3 + 1] = y * scale + 6;
      heartPos[i3 + 2] = z * scale;
    }
    heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    const heartMat = new THREE.PointsMaterial({
      color: 0xff1447,
      size: 0.28,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.95
    });
    const heart = new THREE.Points(heartGeo, heartMat);
    scene.add(heart);

    // 4. Текстовые спрайты вокруг сердца
    function createTextSprite(text) {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      c.width = 512;
      c.height = 128;
      ctx.fillStyle = "rgba(255, 45, 95, 0.95)";
      ctx.shadowColor = "#ff0055";
      ctx.shadowBlur = 15;
      ctx.font = "Bold 36px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(text, 256, 75);

      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(7.5, 1.85, 1);
      return sprite;
    }

    const words = ["TE AMO", "INFINITO ∞", "AMOR DE MI VIDA", "AMOR ETERNO"];
    const labelsGroup = new THREE.Group();
    scene.add(labelsGroup);

    words.forEach((w, idx) => {
      const s = createTextSprite(w);
      const angle = (idx / words.length) * Math.PI * 2;
      s.position.set(Math.cos(angle) * 20, -1, Math.sin(angle) * 20);
      labelsGroup.add(s);
    });

    // 5. Интерактивные летающие фото-спрайты
    const clickableSprites = [];
    const photoGroup = new THREE.Group();
    scene.add(photoGroup);

    const textureLoader = new THREE.TextureLoader();

    memories.forEach((mem, index) => {
      textureLoader.load(mem.image, (texture) => {
        const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(5.5, 5.5, 1);

        const angle = (index / memories.length) * Math.PI * 2;
        const radius = 17;
        sprite.position.set(Math.cos(angle) * radius, 3, Math.sin(angle) * radius);

        // Привязываем данные к объекту
        sprite.userData = { ...mem };
        clickableSprites.push(sprite);
        photoGroup.add(sprite);
      });
    });

    // Raycaster для кликов по объектам
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onPointerDown(event) {
      // Игнорируем клик, если открыто окно карточки
      if (modalOverlay.classList.contains('active')) return;

      const clientX = event.clientX || (event.touches && event.touches[0].clientX);
      const clientY = event.clientY || (event.touches && event.touches[0].clientY);

      if (!clientX || !clientY) return;

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableSprites);

      if (intersects.length > 0) {
        const target = intersects[0].object;
        openCard(target.userData);
      }
    }

    window.addEventListener('click', onPointerDown);

    function openCard(data) {
      cardImg.src = data.image;
      cardTitle.textContent = data.title;
      cardDesc.textContent = data.desc;
      modalOverlay.classList.add('active');
    }

    closeModalBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });

    // Запуск проекта и звука
    startBtn.addEventListener('click', () => {
      startScreen.classList.add('hidden');
      if (bgMusic) {
        bgMusic.play().catch(e => console.log("Audio waiting for user:", e));
      }
    });

    // Анимационный цикл
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      galaxy.rotation.y = time * 0.1;
      labelsGroup.rotation.y = -time * 0.07;
      photoGroup.rotation.y = time * 0.05;

      // Пульсация сердца
      const pulse = 1 + Math.sin(time * 3) * 0.05;
      heart.scale.set(pulse, pulse, pulse);

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
