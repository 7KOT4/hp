<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>З Днем Народження! 🎂✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    body {
      background-color: #020005;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      width: 100vw;
      height: 100vh;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Подсказка старта tlanex */
    #start-hint {
      position: fixed;
      bottom: calc(30px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      color: rgba(255, 185, 215, 0.95);
      background: rgba(24, 3, 14, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 77, 109, 0.45);
      box-shadow: 0 0 30px rgba(255, 42, 95, 0.4);
      pointer-events: none;
      white-space: nowrap;
      animation: pulseHint 2.4s infinite ease-in-out;
      transition: opacity 0.5s ease;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.55; transform: translateX(-50%) scale(0.97); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.02); }
    }

    /* Модалка с поздравлениями */
    #photo-card-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      background: radial-gradient(circle at center, rgba(35, 3, 18, 0.75) 0%, rgba(0, 0, 0, 0.92) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #photo-card-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .memory-card {
      background: rgba(20, 2, 10, 0.96);
      border: 1px solid rgba(255, 64, 129, 0.5);
      box-shadow: 0 0 50px rgba(255, 30, 90, 0.45);
      border-radius: 26px;
      padding: 20px 18px;
      max-width: 320px;
      width: 86%;
      text-align: center;
      transform: scale(0.7) translateY(35px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #photo-card-container.active .memory-card {
      transform: scale(1) translateY(0);
    }

    .memory-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      margin-bottom: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .memory-card h2 {
      font-size: 1.18rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ff4d6d;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.6);
    }

    .memory-card p {
      font-size: 0.88rem;
      color: #eedde5;
      line-height: 1.4;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .card-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 77, 109, 0.35);
      color: #fff;
      font-size: 0.85rem;
      padding: 9px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s all;
    }

    .btn-action.next {
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      border: none;
      box-shadow: 0 0 16px rgba(255, 42, 95, 0.6);
    }

    .btn-action:active {
      transform: scale(0.95);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Аудио -->
  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

  <div id="start-hint">ТОРКНІТЬСЯ ЕКРАНА, ЩОБ ВІДКРИТИ ПРИВІТАННЯ ✨</div>

  <div id="photo-card-container">
    <div class="memory-card">
      <img id="card-img" src="" alt="Спогад">
      <h2 id="card-title"></h2>
      <p id="card-desc"></p>
      <div class="card-actions">
        <button class="btn-action next" id="next-btn">ДАЛІ 💌</button>
        <button class="btn-action" id="close-btn">ЗАКРИТИ ✕</button>
      </div>
    </div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    const memories = [
      {
        title: "З Днем Народження! 🎂✨",
        desc: "Залишайся завжди такою ж яскравою, неповторною і крутою!",
        image: "1.jpg"
      },
      {
        title: "Найкращі Спогади 🌸",
        desc: "Дякую за всі наші спільні моменти, сміх і теплі розмови!",
        image: "2.jpg"
      },
      {
        title: "Сяй Яскраво 💖",
        desc: "Нехай усі твої найзаповітніші мрії та плани здійснюються легко!",
        image: "3.jpg"
      },
      {
        title: "Ти Найкраща Подруга 🪐",
        desc: "Безмежно радий, що ти в мене є. Найкрутішого тобі свята! 🎉",
        image: "4.jpg"
      }
    ];

    let currentMemoryIndex = 0;

    const canvas = document.getElementById('webgl-canvas');
    const startHint = document.getElementById('start-hint');
    const bgMusic = document.getElementById('bg-music');

    const cardContainer = document.getElementById('photo-card-container');
    const cardImg = document.getElementById('card-img');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');
    const nextBtn = document.getElementById('next-btn');
    const closeBtn = document.getElementById('close-btn');

    function createGlowDotTexture() {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.25, 'rgba(255, 80, 140, 0.9)');
      grad.addColorStop(0.65, 'rgba(255, 20, 80, 0.2)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }
    const glowDotTex = createGlowDotTexture();

    // 1. Сцена и камера
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020005, 0.007);

    const isMobile = window.innerWidth < window.innerHeight;
    const initialFov = isMobile ? 74 : 60;

    const camera = new THREE.PerspectiveCamera(initialFov, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, isMobile ? 42 : 36);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: window.devicePixelRatio < 2,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.maxDistance = 120;
    controls.minDistance = 15;
    controls.target.set(0, 0, 0);
    controls.enabled = false;

    // Фоновые мягкие звезды
    const bgStarsGeo = new THREE.BufferGeometry();
    const bgPos = new Float32Array(2200 * 3);
    for (let i = 0; i < 2200 * 3; i++) bgPos[i] = (Math.random() - 0.5) * 260;
    bgStarsGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
    const bgStars = new THREE.Points(bgStarsGeo, new THREE.PointsMaterial({
      color: 0xffb3c6,
      size: 0.65,
      map: glowDotTex,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    scene.add(bgStars);

    // Падающие кометы
    const meteors = [];
    for (let i = 0; i < 3; i++) {
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(-8, -4, -5)]);
      const lineMat = new THREE.LineBasicMaterial({
        color: 0xff85b2,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending
      });
      const meteor = new THREE.Line(lineGeo, lineMat);
      scene.add(meteor);

      meteors.push({
        mesh: meteor,
        active: false,
        timer: Math.random() * 2.5,
        speed: 2.2 + Math.random() * 0.8
      });
    }

    // ==============================================================
    // 2. ВОРОНКА ПОЗДРАВЛЕНИЙ TLANEX
    // ==============================================================
    function createBdayWordTex(text) {
      const c = document.createElement('canvas');
      c.width = 380; c.height = 84;
      const ctx = c.getContext('2d');
      ctx.font = "bold 33px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#ff4d88"; ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 14;
      ctx.fillText(text, 190, 42);
      return new THREE.CanvasTexture(c);
    }

    const bdayPhrases = [
      "З Днем Народження! ✨",
      "Happy Birthday 🎂",
      "Ти найкраща 💖",
      "Сяй яскраво 🌟",
      "Будь щасливою 🎉",
      "З Днем Народження! 🌸",
      "Зі Святом! 🥳"
    ];
    const spiralGroup = new THREE.Group();
    scene.add(spiralGroup);
    const spiralWords = [];

    const spiralCount = isMobile ? 110 : 150;
    for (let i = 0; i < spiralCount; i++) {
      const tex = createBdayWordTex(bdayPhrases[i % bdayPhrases.length]);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.98, blending: THREE.AdditiveBlending });
      const sprite = new THREE.Sprite(mat);

      const t = i / spiralCount;
      const angle = t * Math.PI * 14; 
      const radius = 1.2 + Math.pow(t, 1.1) * 24.0;

      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.y = Math.sin(angle) * radius;
      sprite.position.z = 0;

      const scale = (isMobile ? 1.6 : 1.9) + t * 4.2;
      sprite.scale.set(scale, scale * 0.24, 1);
      sprite.userData = { baseX: sprite.position.x, baseY: sprite.position.y };

      spiralWords.push(sprite);
      spiralGroup.add(sprite);
    }

    // ==============================================================
    // 3. МИР СЕРДЦА, ГАЛАКТИКИ И ЗВЕЗДНОГО ОЗЕРА
    // ==============================================================
    const galaxyWorld = new THREE.Group();
    galaxyWorld.position.set(0, 0, 0);
    galaxyWorld.scale.set(0.001, 0.001, 0.001);
    scene.add(galaxyWorld);

    // Спиральный диск галактики
    const galaxyCount = isMobile ? 26000 : 38000;
    const galaxyGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(galaxyCount * 3);
    const colors = new Float32Array(galaxyCount * 3);
    const colorInside = new THREE.Color('#ff2060');
    const colorOutside = new THREE.Color('#220010');

    for (let i = 0; i < galaxyCount; i++) {
      const i3 = i * 3;
      const radius = 1.5 + Math.pow(Math.random(), 1.3) * 35;
      const spin = radius * 1.7;
      const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

      const rx = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.28 * radius;
      const ry = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.1 * radius;
      const rz = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.28 * radius;

      positions[i3] = Math.cos(branchAngle + spin) * radius + rx;
      positions[i3 + 1] = ry - 4.5;
      positions[i3 + 2] = Math.sin(branchAngle + spin) * radius + rz;

      const normR = radius / 36.5;
      const mixed = colorInside.clone().lerp(colorOutside, normR);
      colors[i3] = mixed.r; colors[i3 + 1] = mixed.g; colors[i3 + 2] = mixed.b;
    }
    galaxyGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    galaxyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const galaxy = new THREE.Points(galaxyGeo, new THREE.PointsMaterial({
      size: 0.45,
      map: glowDotTex,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true
    }));
    galaxyWorld.add(galaxy);

    // Светящееся звездное озеро снизу под фото
    const nebulaLakeCount = isMobile ? 5500 : 8500;
    const nebulaLakeGeo = new THREE.BufferGeometry();
    const nebulaLakePos = new Float32Array(nebulaLakeCount * 3);
    const nebulaLakeCols = new Float32Array(nebulaLakeCount * 3);
    const colLakeCore = new THREE.Color('#ff2a6d');
    const colLakeMid = new THREE.Color('#ff0055');
    const colLakeEdge = new THREE.Color('#2d0213');

    for (let i = 0; i < nebulaLakeCount; i++) {
      const i3 = i * 3;
      const rad = 1.8 + Math.pow(Math.random(), 0.72) * 28.0;
      const ang = Math.random() * Math.PI * 2;
      const depthY = -6.2 + Math.pow(rad / 28.0, 2) * 3.2 + (Math.random() - 0.5) * 1.5;

      nebulaLakePos[i3] = Math.cos(ang) * rad;
      nebulaLakePos[i3 + 1] = depthY;
      nebulaLakePos[i3 + 2] = Math.sin(ang) * rad;

      let c = colLakeCore.clone();
      const norm = rad / 28.0;
      if (norm < 0.5) {
        c.lerp(colLakeMid, norm / 0.5);
      } else {
        c.lerpColors(colLakeMid, colLakeEdge, (norm - 0.5) / 0.5);
      }

      nebulaLakeCols[i3] = c.r;
      nebulaLakeCols[i3 + 1] = c.g;
      nebulaLakeCols[i3 + 2] = c.b;
    }
    nebulaLakeGeo.setAttribute('position', new THREE.BufferAttribute(nebulaLakePos, 3));
    nebulaLakeGeo.setAttribute('color', new THREE.BufferAttribute(nebulaLakeCols, 3));

    const nebulaLake = new THREE.Points(nebulaLakeGeo, new THREE.PointsMaterial({
      size: isMobile ? 0.85 : 1.05,
      map: glowDotTex,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    galaxyWorld.add(nebulaLake);

    // Восходящие светлячки со дна озера к фото
    const bottomFirefliesCount = isMobile ? 120 : 200;
    const firefliesGeo = new THREE.BufferGeometry();
    const firefliesPos = new Float32Array(bottomFirefliesCount * 3);
    const firefliesVel = [];

    for (let i = 0; i < bottomFirefliesCount; i++) {
      firefliesPos[i * 3] = (Math.random() - 0.5) * 32;
      firefliesPos[i * 3 + 1] = -6.0 + Math.random() * 5.5;
      firefliesPos[i * 3 + 2] = (Math.random() - 0.5) * 32;
      firefliesVel.push({
        y: 0.02 + Math.random() * 0.03,
        x: (Math.random() - 0.5) * 0.015,
        z: (Math.random() - 0.5) * 0.015
      });
    }
    firefliesGeo.setAttribute('position', new THREE.BufferAttribute(firefliesPos, 3));
    const fireflies = new THREE.Points(firefliesGeo, new THREE.PointsMaterial({
      color: 0xffd166,
      size: 0.65,
      map: glowDotTex,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.85,
      depthWrite: false
    }));
    galaxyWorld.add(fireflies);

    // Тонкие неоновые кольца
    function createCenterRing(r, tiltX, col) {
      const pts = [];
      for (let i = 0; i <= 100; i++) {
        const a = (i / 100) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
      }
      const ring = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending })
      );
      ring.rotation.x = tiltX;
      ring.position.y = 6.2;
      return ring;
    }
    const ring1 = createCenterRing(19, 0.35, 0xff2a70);
    const ring2 = createCenterRing(23, -0.25, 0xff75a0);
    galaxyWorld.add(ring1);
    galaxyWorld.add(ring2);

    // 4. Плотное сияющее сердце дружбы
    const heartCenterGroup = new THREE.Group();
    galaxyWorld.add(heartCenterGroup);

    const heartLight = new THREE.PointLight(0xff2a6d, 4.2, 60);
    heartLight.position.set(0, 6.5, 0);
    heartCenterGroup.add(heartLight);

    const coreGeo = new THREE.SphereGeometry(3.6, 24, 24);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xff1450, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending });
    const innerCore = new THREE.Mesh(coreGeo, coreMat);
    innerCore.position.set(0, 6.5, 0);
    heartCenterGroup.add(innerCore);

    const heartCount = isMobile ? 12000 : 18000;
    const heartGeo = new THREE.BufferGeometry();
    const heartPos = new Float32Array(heartCount * 3);
    const heartColors = new Float32Array(heartCount * 3);
    const colEdge = new THREE.Color('#ff0d55');
    const colInside = new THREE.Color('#ff85a2');
    const colCore = new THREE.Color('#ffffff');

    for (let i = 0; i < heartCount; i++) {
      const i3 = i * 3;
      const t = Math.PI * 2 * Math.random();
      const xBase = 16 * Math.pow(Math.sin(t), 3);
      const yBase = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const fill = Math.pow(Math.random(), 0.55);
      const zDepth = (Math.random() - 0.5) * 9.0 * fill;

      const scale = 0.70 * fill;
      heartPos[i3] = xBase * scale;
      heartPos[i3 + 1] = yBase * scale + 6.5;
      heartPos[i3 + 2] = zDepth;

      let c = colEdge.clone();
      if (fill < 0.45) c.lerp(colCore, 1 - fill / 0.45);
      else c.lerp(colInside, 0.5);

      heartColors[i3] = c.r; heartColors[i3 + 1] = c.g; heartColors[i3 + 2] = c.b;
    }
    heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

    const heart = new THREE.Points(heartGeo, new THREE.PointsMaterial({
      size: isMobile ? 0.5 : 0.55,
      map: glowDotTex,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.95,
      depthWrite: false
    }));
    heartCenterGroup.add(heart);

    // Парящие праздничные искры
    const embersCount = isMobile ? 320 : 500;
    const embersGeo = new THREE.BufferGeometry();
    const embersPos = new Float32Array(embersCount * 3);
    const embersVelocity = [];
    for (let i = 0; i < embersCount; i++) {
      embersPos[i * 3] = (Math.random() - 0.5) * 16;
      embersPos[i * 3 + 1] = 4 + Math.random() * 12;
      embersPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
      embersVelocity.push({ y: 0.03 + Math.random() * 0.04, x: (Math.random() - 0.5) * 0.015, z: (Math.random() - 0.5) * 0.015 });
    }
    embersGeo.setAttribute('position', new THREE.BufferAttribute(embersPos, 3));
    const embers = new THREE.Points(embersGeo, new THREE.PointsMaterial({
      color: 0xff70a0,
      size: 0.7,
      map: glowDotTex,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.85,
      depthWrite: false
    }));
    heartCenterGroup.add(embers);

    // Праздничные надписи на орбитах
    function createOrbitText(text) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = "rgba(255, 45, 95, 0.95)"; ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 18;
      ctx.font = "Bold 34px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(text, 256, 75);
      return new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
    }
    const words = ["З ДНЕМ НАРОДЖЕННЯ! 🎂", "СЯЙ ЯСКРАВО ✨", "НАЙКРАЩА ПОДРУГА 💖", "ТВІЙ ДЕНЬ 🎉"];
    const labelsGroup = new THREE.Group();
    galaxyWorld.add(labelsGroup);
    words.forEach((w, idx) => {
      const s = createOrbitText(w);
      s.scale.set(7.5, 1.85, 1);
      const angle = (idx / words.length) * Math.PI * 2;
      s.position.set(Math.cos(angle) * 24.5, -2, Math.sin(angle) * 24.5);
      labelsGroup.add(s);
    });

    // ==============================================================
    // 5. УВЕЛИЧЕННЫЕ, СОЧНЫЕ ФОТО-МЕДАЛЬОНЫ БЕЗ РАСТЯЖЕНИЯ
    // ==============================================================
    function createPremiumBadge(imgUrl, callback) {
      const img = new Image();
      img.src = imgUrl;
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 320; c.height = 320;
        const ctx = c.getContext('2d');

        const centerX = 160;
        const centerY = 160;
        const outerGlowRadius = 142;
        const photoRadius = 122;

        // Яркий неоновый ореол
        ctx.beginPath();
        ctx.arc(centerX, centerY, outerGlowRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#ff2060';
        ctx.shadowColor = '#ff3377';
        ctx.shadowBlur = 30;
        ctx.fill();

        // Кадрирование без сплющивания (Object-Fit: Cover)
        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX, centerY, photoRadius, 0, Math.PI * 2);
        ctx.clip();

        const imgAspect = img.width / img.height;
        let sWidth, sHeight, sx, sy;

        if (imgAspect > 1) {
          sHeight = img.height;
          sWidth = img.height;
          sx = (img.width - sWidth) / 2;
          sy = 0;
        } else {
          sWidth = img.width;
          sHeight = img.width;
          sx = 0;
          sy = (img.height - sHeight) / 2;
        }

        ctx.drawImage(img, sx, sy, sWidth, sHeight, centerX - photoRadius, centerY - photoRadius, photoRadius * 2, photoRadius * 2);
        ctx.restore();

        // Белая контурная окантовка
        ctx.beginPath();
        ctx.arc(centerX, centerY, photoRadius, 0, Math.PI * 2);
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // Внешнее золотое кольцо
        ctx.beginPath();
        ctx.arc(centerX, centerY, photoRadius + 7, 0, Math.PI * 2);
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffd166';
        ctx.stroke();

        // Иконка-акцент
        ctx.font = '38px sans-serif';
        ctx.fillText('✨', 225, 275);

        callback(new THREE.CanvasTexture(c));
      };

      img.onerror = () => {
        const c = document.createElement('canvas');
        c.width = 320; c.height = 320;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ff2060';
        ctx.beginPath(); ctx.arc(160, 160, 125, 0, Math.PI * 2); ctx.fill();
        ctx.font = '90px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('📸', 160, 195);
        callback(new THREE.CanvasTexture(c));
      };
    }

    const miniBadges = [];
    const badgesGroup = new THREE.Group();
    galaxyWorld.add(badgesGroup);

    memories.forEach((mem, index) => {
      createPremiumBadge(mem.image, (texture) => {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
        
        // УВЕЛИЧЕННЫЙ МАСШТАБ (крупные, привлекающие внимание карточки)
        const badgeScale = isMobile ? 5.6 : 5.0;
        sprite.scale.set(badgeScale, badgeScale, 1);

        const angle = (index / memories.length) * Math.PI * 2;
        const radius = isMobile ? 16.2 : 17.8;

        sprite.position.set(Math.cos(angle) * radius, -2.4, Math.sin(angle) * radius);
        
        sprite.userData = {
          index: index,
          baseAngle: angle,
          radius: radius,
          baseScale: badgeScale,
          floatSpeedY: 1.5 + index * 0.35,
          floatOffset: index * Math.PI * 0.5
        };

        miniBadges.push(sprite);
        badgesGroup.add(sprite);
      });
    });

    // Клики и тапы по фото
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let pStartX = 0, pStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      pStartX = e.clientX; pStartY = e.clientY;
    }, { passive: true });

    window.addEventListener('pointerup', (e) => {
      if (!flightActive && flightProgress === 0) {
        startHyperspaceFlight();
        return;
      }
      if (cardContainer.classList.contains('active')) return;
      if (Math.hypot(e.clientX - pStartX, e.clientY - pStartY) > 8) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(miniBadges);
      if (hits.length > 0) showMemory(hits[0].object.userData.index);
    });

    function showMemory(index) {
      currentMemoryIndex = index;
      const data = memories[index];
      cardImg.src = data.image;
      cardTitle.textContent = data.title;
      cardDesc.textContent = data.desc;
      cardContainer.classList.add('active');
    }

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMemoryIndex = (currentMemoryIndex + 1) % memories.length;
      showMemory(currentMemoryIndex);
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      cardContainer.classList.remove('active');
    });

    cardContainer.addEventListener('click', (e) => {
      if (e.target === cardContainer) cardContainer.classList.remove('active');
    });

    // 6. Бесшовный пролет в центр
    let flightActive = false;
    let flightProgress = 0;
    const startCamPos = new THREE.Vector3(0, 0, isMobile ? 42 : 36);
    const endCamPos = new THREE.Vector3(0, isMobile ? 28 : 26, isMobile ? 64 : 56);

    function startHyperspaceFlight() {
      flightActive = true;
      startHint.style.opacity = '0';
      setTimeout(() => startHint.remove(), 400);

      if (bgMusic) bgMusic.play().catch(e => console.log(e));
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Падающие кометы
      meteors.forEach(m => {
        if (!m.active) {
          m.timer -= 0.016;
          if (m.timer <= 0) {
            m.active = true;
            m.mesh.position.set(
              (Math.random() - 0.5) * 90 + 20,
              25 + Math.random() * 20,
              -30 + (Math.random() - 0.5) * 40
            );
            m.mesh.material.opacity = 0.85;
          }
        } else {
          m.mesh.position.x -= m.speed;
          m.mesh.position.y -= m.speed * 0.5;
          m.mesh.position.z -= m.speed * 0.6;
          m.mesh.material.opacity -= 0.012;
          if (m.mesh.material.opacity <= 0) {
            m.active = false;
            m.timer = 1.2 + Math.random() * 3.5;
          }
        }
      });

      // Спираль слов до старта
      if (!flightActive && flightProgress === 0) {
        spiralGroup.rotation.z = -t * 0.16;
      }

      // Полет сквозь спираль
      if (flightActive) {
        flightProgress += 0.012;
        const p = Math.min(flightProgress, 1);
        const ease = p * p * (3 - 2 * p);

        camera.position.x = (1 - ease) * startCamPos.x + ease * endCamPos.x;
        camera.position.y = Math.sin(ease * Math.PI * 0.5) * endCamPos.y;
        camera.position.z = THREE.MathUtils.lerp(startCamPos.z, endCamPos.z, ease);
        camera.lookAt(0, 0, 0);

        spiralGroup.rotation.z -= (0.02 + ease * 0.1);
        spiralWords.forEach(s => {
          s.position.x = s.userData.baseX * (1 + ease * 4.0);
          s.position.y = s.userData.baseY * (1 + ease * 4.0);
          s.material.opacity = Math.max(0, 0.98 - ease * 1.3);
        });

        galaxyWorld.scale.set(ease, ease, ease);
        galaxy.rotation.y += (1 - p) * 0.08;

        if (p >= 1) {
          flightActive = false;
          scene.remove(spiralGroup);
          controls.enabled = true;
        }
      }

      // Жизнь мира после прилета
      if (flightProgress >= 1) {
        galaxy.rotation.y += 0.002;
        nebulaLake.rotation.y = -t * 0.014;
        labelsGroup.rotation.y = -t * 0.08;

        ring1.rotation.y = t * 0.05;
        ring2.rotation.y = -t * 0.04;

        // Плавный полет фото с эффектом приближения к зрителю
        miniBadges.forEach((b) => {
          const d = b.userData;
          const curAngle = d.baseAngle + t * 0.09;

          const curRadius = d.radius + Math.sin(t * 1.6 + d.floatOffset) * 0.5;
          b.position.x = Math.cos(curAngle) * curRadius;
          b.position.z = Math.sin(curAngle) * curRadius;

          b.position.y = -2.3 + Math.sin(t * d.floatSpeedY + d.floatOffset) * 0.65;

          // ДИНАМИЧЕСКИЙ МАСШТАБ: фото плавно увеличивается, когда подлетает вперед
          const proximityBonus = (b.position.z > 0) ? (b.position.z / d.radius) * 0.28 : 0;
          const breathPulse = Math.sin(t * 2.2 + d.floatOffset) * 0.05;
          const totalScale = d.baseScale * (1 + proximityBonus + breathPulse);

          b.scale.set(totalScale, totalScale, 1);
        });

        // Движение светлячков со дна озера к фото
        const ffPos = firefliesGeo.attributes.position;
        for (let i = 0; i < bottomFirefliesCount; i++) {
          ffPos.array[i * 3 + 1] += firefliesVel[i].y;
          ffPos.array[i * 3] += firefliesVel[i].x;
          ffPos.array[i * 3 + 2] += firefliesVel[i].z;

          if (ffPos.array[i * 3 + 1] > 0.5) {
            ffPos.array[i * 3 + 1] = -6.2;
            ffPos.array[i * 3] = (Math.random() - 0.5) * 30;
            ffPos.array[i * 3 + 2] = (Math.random() - 0.5) * 30;
          }
        }
        firefliesGeo.needsUpdate = true;

        // Пульсация сердца
        const beat = 1 + Math.sin(t * 3.4) * 0.07;
        heart.scale.set(beat, beat, beat);
        innerCore.scale.set(beat * 1.1, beat * 1.1, beat * 1.1);
        heartLight.intensity = 2.8 + Math.sin(t * 3.4) * 1.5;

        // Парящие искры из сердца
        const posAttr = embersGeo.attributes.position;
        for (let i = 0; i < embersCount; i++) {
          posAttr.array[i * 3 + 1] += embersVelocity[i].y;
          posAttr.array[i * 3] += embersVelocity[i].x;
          posAttr.array[i * 3 + 2] += embersVelocity[i].z;
          if (posAttr.array[i * 3 + 1] > 18) {
            posAttr.array[i * 3 + 1] = 3.5;
            posAttr.array[i * 3] = (Math.random() - 0.5) * 10;
            posAttr.array[i * 3 + 2] = (Math.random() - 0.5) * 8;
          }
        }
        embersGeo.needsUpdate = true;

        controls.update();
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const mob = window.innerWidth < window.innerHeight;
      camera.fov = mob ? 74 : 60;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
