<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Галактика Кохання ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #020005;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* Подсказка снизу как на видео */
    #start-hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      font-size: 0.82rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      color: rgba(255, 170, 205, 0.85);
      background: rgba(25, 2, 12, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 77, 109, 0.35);
      box-shadow: 0 0 25px rgba(255, 42, 95, 0.35);
      pointer-events: none;
      animation: pulseHint 2.2s infinite ease-in-out;
      transition: opacity 0.8s ease;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(0.97); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.02); }
    }

    /* Модальное окно просмотра воспоминания */
    #photo-card-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      background: radial-gradient(circle at center, rgba(35, 3, 16, 0.6) 0%, rgba(0, 0, 0, 0.85) 100%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #photo-card-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .memory-card {
      background: rgba(18, 2, 8, 0.94);
      border: 1px solid rgba(255, 64, 129, 0.45);
      box-shadow: 0 0 50px rgba(255, 30, 90, 0.4);
      border-radius: 26px;
      padding: 22px 20px;
      max-width: 320px;
      width: 86%;
      text-align: center;
      transform: scale(0.7) translateY(40px);
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }

    #photo-card-container.active .memory-card {
      transform: scale(1) translateY(0);
    }

    .memory-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .memory-card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ff4d6d;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
    }

    .memory-card p {
      font-size: 0.92rem;
      color: #e0d0d8;
      line-height: 1.45;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .card-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 77, 109, 0.35);
      color: #fff;
      font-size: 0.88rem;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s all;
    }

    .btn-action.next {
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      border: none;
      box-shadow: 0 0 15px rgba(255, 42, 95, 0.5);
    }

    .btn-action:hover {
      transform: scale(1.05);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Аудио -->
  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

  <!-- Подсказка старта -->
  <div id="start-hint">ТОРКНІТЬСЯ ЕКРАНА, ЩОБ РОЗПОЧАТИ ПОДОРОЖ</div>

  <!-- Модальное окно фото -->
  <div id="photo-card-container">
    <div class="memory-card">
      <img id="card-img" src="" alt="Спогад">
      <h2 id="card-title"></h2>
      <p id="card-desc"></p>
      <div class="card-actions">
        <button class="btn-action next" id="next-btn">ДАЛІ 💌</button>
        <button class="btn-action" id="close-btn">ЗАКРИТИ ✕</button>
      </div>
    </div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    const memories = [
      {
        title: "Кохання Мого Життя ❤️",
        desc: "Що більше часу ми разом, то сильніше я тебе кохаю.",
        image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=700"
      },
      {
        title: "Ти Моє Серденько ✨",
        desc: "Якби я міг обрати найбезпечніше місце у світі — це було б поруч із тобою.",
        image: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=700"
      },
      {
        title: "Нескінченність ♾️",
        desc: "У будь-якій галактиці та в кожному житті я знову й знову обираю тебе.",
        image: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=700"
      },
      {
        title: "Ти і Я 🪐",
        desc: "Ти — моя найяскравіша зірка у всьому цьому безмежному всесвіті.",
        image: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=700"
      }
    ];

    let currentMemoryIndex = 0;

    const canvas = document.getElementById('webgl-canvas');
    const startHint = document.getElementById('start-hint');
    const bgMusic = document.getElementById('bg-music');

    const cardContainer = document.getElementById('photo-card-container');
    const cardImg = document.getElementById('card-img');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');
    const nextBtn = document.getElementById('next-btn');
    const closeBtn = document.getElementById('close-btn');

    // 1. Сцена и Камера
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020005, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 60);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxDistance = 110;
    controls.minDistance = 12;

    const galaxyWorld = new THREE.Group();
    galaxyWorld.scale.set(0.001, 0.001, 0.001);
    scene.add(galaxyWorld);

    // 2. Фоновые звезды
    const bgStarsGeo = new THREE.BufferGeometry();
    const bgPos = new Float32Array(2500 * 3);
    for (let i = 0; i < 2500 * 3; i++) {
      bgPos[i] = (Math.random() - 0.5) * 220;
    }
    bgStarsGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
    const bgStarsMat = new THREE.PointsMaterial({ color: 0xffaacc, size: 0.35, transparent: true, opacity: 0.8 });
    scene.add(new THREE.Points(bgStarsGeo, bgStarsMat));

    // ==============================================================
    // 3. ПРАВИЛЬНАЯ ДИНАМИЧЕСКАЯ СПИРАЛЬ СЛОВ (ВОРОНКА КАК В TLANEX)
    // ==============================================================
    function createTextCanvasTexture(text) {
      const c = document.createElement('canvas');
      c.width = 300;
      c.height = 70;
      const ctx = c.getContext('2d');

      ctx.font = "bold 32px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // Мягкий нежный розовый неон
      ctx.shadowColor = "#ff2a6d";
      ctx.shadowBlur = 10;
      ctx.fillStyle = "#ff6599";
      ctx.fillText(text, 150, 35);

      const tex = new THREE.CanvasTexture(c);
      return tex;
    }

    const phrases = ["Te amo", "I love you", "Кохаю тебе", "Te quiero", "Ti amo", "Je t'aime"];
    const phraseTextures = phrases.map(p => createTextCanvasTexture(p));

    const spiralGroup = new THREE.Group();
    scene.add(spiralGroup);

    const SPIRAL_ITEMS_COUNT = 140;
    const spiralSprites = [];

    // Создаем элементы спирали
    for (let i = 0; i < SPIRAL_ITEMS_COUNT; i++) {
      const tex = phraseTextures[i % phraseTextures.length];
      const mat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending
      });
      const sprite = new THREE.Sprite(mat);

      // Прогресс вдоль вихря от 0 (центр воронки) до 1 (край у камеры)
      const u = i / SPIRAL_ITEMS_COUNT;

      sprite.userData = {
        progress: u,
        speed: 0.0016 // базовая скорость движения наружу
      };

      spiralSprites.push(sprite);
      spiralGroup.add(sprite);
    }

    // Расчет математической траектории спирали Архимеда в глубь экрана
    function updateSpiralPosition(sprite, p) {
      // p: от 0 (далеко в центре) до 1 (близко у камеры)
      const turns = 7.5; // количество витков
      const angle = p * Math.PI * 2 * turns;
      
      // Радиус плавно растет наружу по спирали
      const radius = 1.0 + Math.pow(p, 1.25) * 26.0;
      
      // Глубина: от -45 в глубине до +15 прямо перед экраном
      const z = -45.0 + Math.pow(p, 1.4) * 60.0;

      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.y = Math.sin(angle) * radius;
      sprite.position.z = z;

      // Размер и прозрачность растут по мере приближения к зрителю
      const scale = 1.2 + p * 6.5;
      sprite.scale.set(scale, scale * 0.24, 1);

      // Плавное растворение в самом центре и у самых краев экрана
      if (p < 0.1) {
        sprite.material.opacity = p / 0.1;
      } else if (p > 0.88) {
        sprite.material.opacity = (1 - p) / 0.12;
      } else {
        sprite.material.opacity = 0.92;
      }
    }

    // Первичная инициализация координат
    spiralSprites.forEach(s => updateSpiralPosition(s, s.userData.progress));

    // 4. Спиральная Галактика (основная сцена)
    const galaxyCount = 38000;
    const galaxyGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(galaxyCount * 3);
    const colors = new Float32Array(galaxyCount * 3);
    const colorInside = new THREE.Color('#ff2050');
    const colorOutside = new THREE.Color('#2b0014');

    for (let i = 0; i < galaxyCount; i++) {
      const i3 = i * 3;
      const radius = Math.random() * 34;
      const spin = radius * 1.6;
      const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

      const rx = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3 * radius;
      const ry = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.12 * radius;
      const rz = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3 * radius;

      positions[i3] = Math.cos(branchAngle + spin) * radius + rx;
      positions[i3 + 1] = ry - 4.5;
      positions[i3 + 2] = Math.sin(branchAngle + spin) * radius + rz;

      const mixed = colorInside.clone().lerp(colorOutside, radius / 34);
      colors[i3] = mixed.r;
      colors[i3 + 1] = mixed.g;
      colors[i3 + 2] = mixed.b;
    }
    galaxyGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    galaxyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const galaxyMat = new THREE.PointsMaterial({
      size: 0.18,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true
    });
    const galaxy = new THREE.Points(galaxyGeo, galaxyMat);
    galaxyWorld.add(galaxy);

    // 5. Сердце
    const heartCount = 6500;
    const heartGeo = new THREE.BufferGeometry();
    const heartPos = new Float32Array(heartCount * 3);

    for (let i = 0; i < heartCount; i++) {
      const i3 = i * 3;
      const t = Math.PI * 2 * Math.random();
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const z = (Math.random() - 0.5) * 8;
      const scale = 0.65;

      heartPos[i3] = x * scale;
      heartPos[i3 + 1] = y * scale + 6.5;
      heartPos[i3 + 2] = z * scale;
    }
    heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    const heartMat = new THREE.PointsMaterial({
      color: 0xff1447,
      size: 0.28,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.95
    });
    const heart = new THREE.Points(heartGeo, heartMat);
    galaxyWorld.add(heart);

    // 6. Надписи на орбите
    function createOrbitTextSprite(text) {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      c.width = 512;
      c.height = 128;
      ctx.fillStyle = "rgba(255, 45, 95, 0.95)";
      ctx.shadowColor = "#ff0055";
      ctx.shadowBlur = 18;
      ctx.font = "Bold 34px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(text, 256, 75);

      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(7.5, 1.85, 1);
      return sprite;
    }

    const words = ["КОХАЮ ТЕБЕ", "НАЗАВЖДИ ∞", "МОЄ СЕРДЕНЬКО", "ВІЧНЕ КОХАННЯ"];
    const labelsGroup = new THREE.Group();
    galaxyWorld.add(labelsGroup);

    words.forEach((w, idx) => {
      const s = createOrbitTextSprite(w);
      const angle = (idx / words.length) * Math.PI * 2;
      s.position.set(Math.cos(angle) * 22, -2, Math.sin(angle) * 22);
      labelsGroup.add(s);
    });

    // 7. Мини-медальоны с фото в диске
    function createMiniBadge(imgUrl, callback) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = imgUrl;
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 160;
        c.height = 160;
        const ctx = c.getContext('2d');

        ctx.beginPath();
        ctx.arc(80, 80, 70, 0, Math.PI * 2);
        ctx.fillStyle = '#ff2060';
        ctx.shadowColor = '#ff2060';
        ctx.shadowBlur = 15;
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.arc(80, 80, 64, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, 0, 0, 160, 160);
        ctx.restore();

        ctx.beginPath();
        ctx.arc(80, 80, 64, 0, Math.PI * 2);
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.font = '24px sans-serif';
        ctx.fillText('💖', 120, 140);

        const tex = new THREE.CanvasTexture(c);
        callback(tex);
      };
    }

    const miniBadges = [];
    const badgesGroup = new THREE.Group();
    galaxyWorld.add(badgesGroup);

    memories.forEach((mem, index) => {
      createMiniBadge(mem.image, (texture) => {
        const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(2.8, 2.8, 1);

        const angle = (index / memories.length) * Math.PI * 2;
        const radius = 15.5;
        sprite.position.set(Math.cos(angle) * radius, -2.5, Math.sin(angle) * radius);

        sprite.userData = { index: index, baseAngle: angle, radius: radius };
        miniBadges.push(sprite);
        badgesGroup.add(sprite);
      });
    });

    // 8. Клик без залипания при вращении
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let pStartX = 0, pStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      pStartX = e.clientX;
      pStartY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (!journeyStarted) {
        startJourney();
        return;
      }

      if (cardContainer.classList.contains('active')) return;

      const dist = Math.hypot(e.clientX - pStartX, e.clientY - pStartY);
      if (dist > 6) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(miniBadges);

      if (hits.length > 0) {
        showMemory(hits[0].object.userData.index);
      }
    });

    function showMemory(index) {
      currentMemoryIndex = index;
      const data = memories[index];
      cardImg.src = data.image;
      cardTitle.textContent = data.title;
      cardDesc.textContent = data.desc;
      cardContainer.classList.add('active');
    }

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMemoryIndex = (currentMemoryIndex + 1) % memories.length;
      showMemory(currentMemoryIndex);
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      cardContainer.classList.remove('active');
    });

    cardContainer.addEventListener('click', (e) => {
      if (e.target === cardContainer) cardContainer.classList.remove('active');
    });

    // 9. СТАРТ И КИНЕМАТОГРАФИЧНЫЙ ГИПЕРПРЫЖОК
    let journeyStarted = false;
    let transitionProgress = 0;
    const targetCameraPos = new THREE.Vector3(0, 26, 56);
    const initialCameraPos = new THREE.Vector3(0, 0, 60);

    function startJourney() {
      journeyStarted = true;
      startHint.style.opacity = '0';
      setTimeout(() => startHint.remove(), 800);

      if (bgMusic) {
        bgMusic.play().catch(e => console.log("Music waiting:", e));
      }
    }

    // 10. Анимационный цикл
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Движение воронки слов
      if (spiralGroup.parent) {
        // Медленное вращение всего вихря
        spiralGroup.rotation.z = -t * 0.22;

        // Скорость потока (при старте ускоряется для гиперпрыжка)
        const flowSpeed = journeyStarted ? 0.006 : 0.0016;

        spiralSprites.forEach(sprite => {
          sprite.userData.progress += flowSpeed;
          if (sprite.userData.progress > 1.0) {
            sprite.userData.progress -= 1.0;
          }
          updateSpiralPosition(sprite, sprite.userData.progress);
        });
      }

      // Плавный переход сквозь поток в галактику
      if (journeyStarted && transitionProgress < 1) {
        transitionProgress += 0.012;
        const p = Math.min(transitionProgress, 1);
        const ease = 1 - Math.pow(1 - p, 3);

        // Полет камеры под ракурс обзора
        camera.position.lerpVectors(initialCameraPos, targetCameraPos, ease);

        // Раскрытие галактики
        galaxyWorld.scale.set(ease, ease, ease);
        galaxy.rotation.y += (1 - p) * 0.06;

        // Растворение спирали
        spiralSprites.forEach(s => {
          s.material.opacity = Math.max(0, s.material.opacity * (1 - p * 0.08));
        });

        if (p >= 1) {
          scene.remove(spiralGroup);
          galaxyWorld.scale.set(1, 1, 1);
        }
      }

      // Жизнь основной галактики
      if (journeyStarted) {
        galaxy.rotation.y += 0.002;
        labelsGroup.rotation.y = -t * 0.08;

        miniBadges.forEach((b, i) => {
          const curAngle = b.userData.baseAngle + t * 0.1;
          b.position.x = Math.cos(curAngle) * b.userData.radius;
          b.position.z = Math.sin(curAngle) * b.userData.radius;
          b.position.y = -2.5 + Math.sin(t * 2 + i) * 0.4;
        });

        const beat = 1 + Math.sin(t * 3.2) * 0.06;
        heart.scale.set(beat, beat, beat);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
