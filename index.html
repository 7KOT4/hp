<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>З Днем Народження! 🎂✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    body {
      background-color: #020005;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      width: 100vw;
      height: 100vh;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Подсказка старта tlanex */
    #start-hint {
      position: fixed;
      bottom: calc(30px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      color: rgba(255, 185, 215, 0.95);
      background: rgba(24, 3, 14, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 77, 109, 0.45);
      box-shadow: 0 0 30px rgba(255, 42, 95, 0.4);
      pointer-events: none;
      white-space: nowrap;
      animation: pulseHint 2.4s infinite ease-in-out;
      transition: opacity 0.5s ease;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.55; transform: translateX(-50%) scale(0.97); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.02); }
    }

    /* Полароидная модалка с поздравлениями */
    #photo-card-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      background: radial-gradient(circle at center, rgba(35, 3, 18, 0.75) 0%, rgba(0, 0, 0, 0.92) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #photo-card-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .memory-card {
      background: #ffffff;
      color: #1a1a1a;
      box-shadow: 0 12px 50px rgba(255, 42, 95, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.5);
      border-radius: 14px;
      padding: 16px 16px 22px 16px;
      max-width: 320px;
      width: 86%;
      text-align: center;
      transform: scale(0.7) translateY(35px) rotate(-1deg);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #photo-card-container.active .memory-card {
      transform: scale(1) translateY(0) rotate(0deg);
    }

    .memory-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      margin-bottom: 14px;
    }

    .memory-card h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ff2a5f;
    }

    .memory-card p {
      font-size: 0.9rem;
      color: #444;
      line-height: 1.45;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .card-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn-action {
      background: #f0f0f2;
      border: 1px solid #ddd;
      color: #333;
      font-size: 0.85rem;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s all;
      font-weight: 600;
    }

    .btn-action.next {
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      color: #fff;
      border: none;
      box-shadow: 0 0 16px rgba(255, 42, 95, 0.45);
    }

    .btn-action:active {
      transform: scale(0.95);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Аудио -->
  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

  <div id="start-hint">ТОРКНІТЬСЯ ЕКРАНА, ЩОБ ВІДКРИТИ ПРИВІТАННЯ ✨</div>

  <!-- Полароидное модальное окно -->
  <div id="photo-card-container">
    <div class="memory-card">
      <img id="card-img" src="" alt="Спогад">
      <h2 id="card-title"></h2>
      <p id="card-desc"></p>
      <div class="card-actions">
        <button class="btn-action next" id="next-btn">ДАЛІ 💌</button>
        <button class="btn-action" id="close-btn">ЗАКРИТИ ✕</button>
      </div>
    </div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    // ==============================================================
    // СПИСОК ФОТО (ДОБАВЛЯЙ СКОЛЬКО ХОЧЕШЬ: 1.jpg, 2.jpg, 3.jpg, 4.jpg...)
    // ==============================================================
    const memories = [
      {
        title: "З Днем Народження! 🎂✨",
        desc: "Залишайся завжди такою ж яскравою, неповторною і крутою!",
        image: "1.jpg"
      },
      {
        title: "Найкращі Спогади 🌸",
        desc: "Дякую за всі наші спільні моменти, сміх і теплі розмови!",
        image: "2.jpg"
      },
      {
        title: "Сяй Яскраво 💖",
        desc: "Нехай усі твої найзаповітніші мрії та плани здійснюються легко!",
        image: "3.jpg"
      },
      {
        title: "Ти Найкраща Подруга 🪐",
        desc: "Безмежно радий, що ти в мене є. Найкрутішого тобі свята! 🎉",
        image: "4.jpg"
      },
      {
        title: "Більше Посмішок! ✨",
        desc: "Нехай кожен день приносить привід щиро радіти життю!",
        image: "5.jpg"
      },
      {
        title: "Твій Особливий День 🥳",
        desc: "Святкуй на повну та насолоджуйся кожною секундою!",
        image: "6.jpg"
      }
    ];

    let currentMemoryIndex = 0;

    const canvas = document.getElementById('webgl-canvas');
    const startHint = document.getElementById('start-hint');
    const bgMusic = document.getElementById('bg-music');

    const cardContainer = document.getElementById('photo-card-container');
    const cardImg = document.getElementById('card-img');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');
    const nextBtn = document.getElementById('next-btn');
    const closeBtn = document.getElementById('close-btn');

    function createGlowDotTexture() {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.25, 'rgba(255, 80, 140, 0.9)');
      grad.addColorStop(0.65, 'rgba(255, 20, 80, 0.2)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }
    const glowDotTex = createGlowDotTexture();

    // 1. Сцена и камера
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020005, 0.007);

    const isMobile = window.innerWidth < window.innerHeight;
    const initialFov = isMobile ? 74 : 60;

    const camera = new THREE.PerspectiveCamera(initialFov, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, isMobile ? 42 : 36);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: window.devicePixelRatio < 2,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.maxDistance = 120;
    controls.minDistance = 15;
    controls.target.set(0, 0, 0);
    controls.enabled = false;

    // Фоновые мягкие звезды
    const bgStarsGeo = new THREE.BufferGeometry();
    const bgPos = new Float32Array(2200 * 3);
    for (let i = 0; i < 2200 * 3; i++) bgPos[i] = (Math.random() - 0.5) * 260;
    bgStarsGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
    const bgStars = new THREE.Points(bgStarsGeo, new THREE.PointsMaterial({
      color: 0xffb3c6,
      size: 0.65,
      map: glowDotTex,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    scene.add(bgStars);

    // Падающие кометы
    const meteors = [];
    for (let i = 0; i < 3; i++) {
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(-8, -4, -5)]);
      const lineMat = new THREE.LineBasicMaterial({
        color: 0xff85b2,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending
      });
      const meteor = new THREE.Line(lineGeo, lineMat);
      scene.add(meteor);

      meteors.push({
        mesh: meteor,
        active: false,
        timer: Math.random() * 2.5,
        speed: 2.2 + Math.random() * 0.8
      });
    }

    // ==============================================================
    // 2. ВОРОНКА ПОЗДРАВЛЕНИЙ TLANEX
    // ==============================================================
    function createBdayWordTex(text) {
      const c = document.createElement('canvas');
      c.width = 380; c.height = 84;
      const ctx = c.getContext('2d');
      ctx.font = "bold 33px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#ff4d88"; ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 14;
      ctx.fillText(text, 190, 42);
      return new THREE.CanvasTexture(c);
    }

    const bdayPhrases = [
      "З Днем Народження! ✨",
      "Happy Birthday 🎂",
      "Ти найкраща 💖",
      "Сяй яскраво 🌟",
      "Будь щасливою 🎉",
      "З Днем Народження! 🌸",
      "Зі Святом! 🥳"
    ];
    const spiralGroup = new THREE.Group();
    scene.add(spiralGroup);
    const spiralWords = [];

    const spiralCount = isMobile ? 110 : 150;
    for (let i = 0; i < spiralCount; i++) {
      const tex = createBdayWordTex(bdayPhrases[i % bdayPhrases.length]);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.98, blending: THREE.AdditiveBlending });
      const sprite = new THREE.Sprite(mat);

      const t = i / spiralCount;
      const angle = t * Math.PI * 14; 
      const radius = 1.2 + Math.pow(t, 1.1) * 24.0;

      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.y = Math.sin(angle) * radius;
      sprite.position.z = 0;

      const scale = (isMobile ? 1.6 : 1.9) + t * 4.2;
      sprite.scale.set(scale, scale * 0.24, 1);
      sprite.userData = { baseX: sprite.position.x, baseY: sprite.position.y };

      spiralWords.push(sprite);
      spiralGroup.add(sprite);
    }

    // ==============================================================
    // 3. МИР СЕРДЦА, ГАЛАКТИКИ И ЗВЕЗДНОГО ОЗЕРА
    // ==============================================================
    const galaxyWorld = new THREE.Group();
    galaxyWorld.position.set(0, 0, 0);
    galaxyWorld.scale.set(0.001, 0.001, 0.001);
    scene.add(galaxyWorld);

    // Спиральный диск галактики
    const galaxyCount = isMobile ? 26000 : 38000;
    const galaxyGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(galaxyCount * 3);
    const colors = new Float32Array(galaxyCount * 3);
    const colorInside = new THREE.Color('#ff2060');
    const colorOutside = new THREE.Color('#220010');

    for (let i = 0; i < galaxyCount; i++) {
      const i3 = i * 3;
      const radius = 1.5 + Math.pow(Math.random(), 1.3) * 35;
      const spin = radius * 1.7;
      const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

      const rx = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.28 * radius;
      const ry = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.1 * radius;
      const rz = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.28 * radius;

      positions[i3] = Math.cos(branchAngle + spin) * radius + rx;
      positions[i3 + 1] = ry - 4.5;
      positions[i3 + 2] = Math.sin(branchAngle + spin) * radius + rz;

      const normR = radius / 36.5;
      const mixed = colorInside.clone().lerp(colorOutside, normR);
      colors[i3] = mixed.r; colors[i3 + 1] = mixed.g; colors[i3 + 2] = mixed.b;
    }
    galaxyGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    galaxyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const galaxy = new THREE.Points(galaxyGeo, new THREE.PointsMaterial({
      size: 0.45,
      map: glowDotTex,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true
    }));
    galaxyWorld.add(galaxy);

    // Светящееся звездное озеро снизу под фото
    const nebulaLakeCount = isMobile ? 5500 : 8500;
    const nebulaLakeGeo = new THREE.BufferGeometry();
    const nebulaLakePos = new Float32Array(nebulaLakeCount * 3);
    const nebulaLakeCols = new Float32Array(nebulaLakeCount * 3);
    const colLakeCore = new THREE.Color('#ff2a6d');
    const colLakeMid = new THREE.Color('#ff0055');
    const colLakeEdge = new THREE.Color('#2d0213');

    for (let i = 0; i < nebulaLakeCount; i++) {
      const i3 = i * 3;
      const rad = 1.8 + Math.pow(Math.random(), 0.72) * 28.0;
      const ang = Math.random() * Math.PI * 2;
      const depthY = -6.4 + Math.pow(rad / 28.0, 2) * 3.2 + (Math.random() - 0.5) * 1.5;

      nebulaLakePos[i3] = Math.cos(ang) * rad;
      nebulaLakePos[i3 + 1] = depthY;
      nebulaLakePos[i3 + 2] = Math.sin(ang) * rad;

      let c = colLakeCore.clone();
      const norm = rad / 28.0;
      if (norm < 0.5) {
        c.lerp(colLakeMid, norm / 0.5);
      } else {
        c.lerpColors(colLakeMid, colLakeEdge, (norm - 0.5) / 0.5);
      }

      nebulaLakeCols[i3] = c.r;
      nebulaLakeCols[i3 + 1] = c.g;
      nebulaLakeCols[i3 + 2] = c.b;
    }
    nebulaLakeGeo.setAttribute('position', new THREE.BufferAttribute(nebulaLakePos, 3));
    nebulaLakeGeo.setAttribute('color', new THREE.BufferAttribute(nebulaLakeCols, 3));

    const nebulaLake = new THREE.Points(nebulaLakeGeo, new THREE.PointsMaterial({
      size: isMobile ? 0.85 : 1.05,
      map: glowDotTex,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    galaxyWorld.add(nebulaLake);

    // 4. Плотное сияющее сердце дружбы
    const heartCenterGroup = new THREE.Group();
    galaxyWorld.add(heartCenterGroup);

    const heartLight = new THREE.PointLight(0xff2a6d, 4.2, 60);
    heartLight.position.set(0, 6.5, 0);
    heartCenterGroup.add(heartLight);

    const coreGeo = new THREE.SphereGeometry(3.6, 24, 24);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xff1450, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending });
    const innerCore = new THREE.Mesh(coreGeo, coreMat);
    innerCore.position.set(0, 6.5, 0);
    heartCenterGroup.add(innerCore);

    const heartCount = isMobile ? 12000 : 18000;
    const heartGeo = new THREE.BufferGeometry();
    const heartPos = new Float32Array(heartCount * 3);
    const heartColors = new Float32Array(heartCount * 3);
    const colEdge = new THREE.Color('#ff0d55');
    const colInside = new THREE.Color('#ff85a2');
    const colCore = new THREE.Color('#ffffff');

    for (let i = 0; i < heartCount; i++) {
      const i3 = i * 3;
      const t = Math.PI * 2 * Math.random();
      const xBase = 16 * Math.pow(Math.sin(t), 3);
      const yBase = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const fill = Math.pow(Math.random(), 0.55);
      const zDepth = (Math.random() - 0.5) * 9.0 * fill;

      const scale = 0.70 * fill;
      heartPos[i3] = xBase * scale;
      heartPos[i3 + 1] = yBase * scale + 6.5;
      heartPos[i3 + 2] = zDepth;

      let c = colEdge.clone();
      if (fill < 0.45) c.lerp(colCore, 1 - fill / 0.45);
      else c.lerp(colInside, 0.5);

      heartColors[i3] = c.r; heartColors[i3 + 1] = c.g; heartColors[i3 + 2] = c.b;
    }
    heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

    const heart = new THREE.Points(heartGeo, new THREE.PointsMaterial({
      size: isMobile ? 0.5 : 0.55,
      map: glowDotTex,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.95,
      depthWrite: false
    }));
    heartCenterGroup.add(heart);

    // Парящие праздничные искры
    const embersCount = isMobile ? 320 : 500;
    const embersGeo = new THREE.BufferGeometry();
    const embersPos = new Float32Array(embersCount * 3);
    const embersVelocity = [];
    for (let i = 0; i < embersCount; i++) {
      embersPos[i * 3] = (Math.random() - 0.5) * 16;
      embersPos[i * 3 + 1] = 4 + Math.random() * 12;
      embersPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
      embersVelocity.push({ y: 0.03 + Math.random() * 0.04, x: (Math.random() - 0.5) * 0.015, z: (Math.random() - 0.5) * 0.015 });
    }
    embersGeo.setAttribute('position', new THREE.BufferAttribute(embersPos, 3));
    const embers = new THREE.Points(embersGeo, new THREE.PointsMaterial({
      color: 0xff70a0,
      size: 0.7,
      map: glowDotTex,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.85,
      depthWrite: false
    }));
    heartCenterGroup.add(embers);

    // ==============================================================
    // 5. КИНЕМАТОГРАФИЧНАЯ ОБЪЁМНАЯ НЕОНОВАЯ ГИРЛЯНДА
    // ==============================================================
    const garlandGroup = new THREE.Group();
    galaxyWorld.add(garlandGroup);

    const ropeRadius = isMobile ? 16.5 : 18.5;
    const numPhotos = memories.length;

    // Плавная кривая с реалистичным провисанием нити под весом карточек
    class GarlandCurve extends THREE.Curve {
      constructor(radius, count) {
        super();
        this.radius = radius;
        this.count = count;
      }
      getPoint(t, optionalTarget = new THREE.Vector3()) {
        const theta = t * Math.PI * 2;
        // Качественный провис цепи (Catenary curve)
        const wave = Math.sin(theta * this.count);
        const sag = Math.pow(Math.abs(wave), 1.2) * (wave > 0 ? -0.7 : -0.7);

        const x = Math.cos(theta) * this.radius;
        const z = Math.sin(theta) * this.radius;
        const y = -1.55 + Math.cos(theta * this.count) * 0.55;

        return optionalTarget.set(x, y, z);
      }
    }

    const garlandPath = new GarlandCurve(ropeRadius, numPhotos);

    // 1. Внутреннее светящееся ядро трубки
    const tubeGeo = new THREE.TubeGeometry(garlandPath, 180, 0.08, 8, true);
    const tubeMat = new THREE.MeshBasicMaterial({
      color: 0xffe6a3,
      transparent: true,
      opacity: 0.95
    });
    const garlandTube = new THREE.Mesh(tubeGeo, tubeMat);
    garlandGroup.add(garlandTube);

    // 2. Внешнее мягкое неоновое гало-свечение вокруг нити
    const tubeGlowGeo = new THREE.TubeGeometry(garlandPath, 180, 0.26, 8, true);
    const tubeGlowMat = new THREE.MeshBasicMaterial({
      color: 0xff3377,
      transparent: true,
      opacity: 0.35,
      blending: THREE.AdditiveBlending,
      side: THREE.BackSide
    });
    const garlandGlow = new THREE.Mesh(tubeGlowGeo, tubeGlowMat);
    garlandGroup.add(garlandGlow);

    // 3. Светящиеся жемчужины/светодиоды на нити
    const bulbCount = 72;
    const bulbGeo = new THREE.BufferGeometry();
    const bulbPos = new Float32Array(bulbCount * 3);
    for (let i = 0; i < bulbCount; i++) {
      const pt = garlandPath.getPoint(i / bulbCount);
      bulbPos[i * 3] = pt.x;
      bulbPos[i * 3 + 1] = pt.y;
      bulbPos[i * 3 + 2] = pt.z;
    }
    bulbGeo.setAttribute('position', new THREE.BufferAttribute(bulbPos, 3));
    const garlandBulbs = new THREE.Points(bulbGeo, new THREE.PointsMaterial({
      color: 0xffdf80,
      size: 0.95,
      map: glowDotTex,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    garlandGroup.add(garlandBulbs);

    // ==============================================================
    // 6. ПОЛАРОИДНЫЕ ФОТО С КРАСИВЫМИ ЗОЛОТЫМИ ПРИЩЕПКАМИ
    // ==============================================================
    function createPolaroidTexture(imgUrl, callback) {
      const img = new Image();
      img.src = imgUrl;
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 340;
        c.height = 440;
        const ctx = c.getContext('2d');

        // Глубокое мягкое свечение карточки
        ctx.shadowColor = 'rgba(255, 42, 95, 0.4)';
        ctx.shadowBlur = 28;

        // Белая полароидная бумага
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(18, 36, 304, 388, [12]);
        ctx.fill();

        ctx.shadowBlur = 0;

        // Реалистичная золотистая деревянная прищепка
        ctx.fillStyle = '#ffd166';
        ctx.shadowColor = 'rgba(255, 209, 102, 0.8)';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.roundRect(154, 8, 32, 54, [4]);
        ctx.fill();

        // Световой блик на прищепке
        ctx.fillStyle = '#fff4cc';
        ctx.fillRect(158, 12, 6, 46);

        // Металлическая спираль/пружинка прищепки
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 0;
        ctx.fillRect(152, 28, 36, 7);

        // Окно фотографии (Object-Fit: Cover)
        const photoX = 34;
        const photoY = 66;
        const photoW = 272;
        const photoH = 272;

        ctx.save();
        ctx.beginPath();
        ctx.rect(photoX, photoY, photoW, photoH);
        ctx.clip();

        const imgAspect = img.width / img.height;
        let sWidth, sHeight, sx, sy;

        if (imgAspect > 1) {
          sHeight = img.height;
          sWidth = img.height;
          sx = (img.width - sWidth) / 2;
          sy = 0;
        } else {
          sWidth = img.width;
          sHeight = img.width;
          sx = 0;
          sy = (img.height - sHeight) / 2;
        }

        ctx.drawImage(img, sx, sy, sWidth, sHeight, photoX, photoY, photoW, photoH);
        ctx.restore();

        // Аккуратная подпись на белом поле
        ctx.font = '600 21px -apple-system, sans-serif';
        ctx.fillStyle = '#ff2a5f';
        ctx.textAlign = 'center';
        ctx.fillText('Happy Birthday! ✨', 170, 388);

        callback(new THREE.CanvasTexture(c));
      };

      img.onerror = () => {
        const c = document.createElement('canvas');
        c.width = 340;
        c.height = 440;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.roundRect(18, 36, 304, 388, [12]);
        ctx.fill();
        ctx.fillStyle = '#ff2a5f';
        ctx.font = '80px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('📸', 170, 230);
        callback(new THREE.CanvasTexture(c));
      };
    }

    const polaroidSprites = [];
    const polaroidGroup = new THREE.Group();
    galaxyWorld.add(polaroidGroup);

    memories.forEach((mem, index) => {
      createPolaroidTexture(mem.image, (texture) => {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
        
        const scaleW = isMobile ? 4.6 : 4.4;
        const scaleH = scaleW * (440 / 340);
        sprite.scale.set(scaleW, scaleH, 1);

        const tVal = index / memories.length;
        const pt = garlandPath.getPoint(tVal);

        // Карточка висит ровно под прищепкой на нити
        sprite.position.set(pt.x, pt.y - 1.8, pt.z);
        
        sprite.userData = {
          index: index,
          tVal: tVal,
          scaleW: scaleW,
          scaleH: scaleH,
          swingSpeed: 1.4 + index * 0.2,
          swingOffset: index * 1.3
        };

        polaroidSprites.push(sprite);
        polaroidGroup.add(sprite);
      });
    });

    // Клики и тапы
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let pStartX = 0, pStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      pStartX = e.clientX; pStartY = e.clientY;
    }, { passive: true });

    window.addEventListener('pointerup', (e) => {
      if (!flightActive && flightProgress === 0) {
        startHyperspaceFlight();
        return;
      }
      if (cardContainer.classList.contains('active')) return;
      if (Math.hypot(e.clientX - pStartX, e.clientY - pStartY) > 8) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(polaroidSprites);
      if (hits.length > 0) showMemory(hits[0].object.userData.index);
    });

    function showMemory(index) {
      currentMemoryIndex = index;
      const data = memories[index];
      cardImg.src = data.image;
      cardTitle.textContent = data.title;
      cardDesc.textContent = data.desc;
      cardContainer.classList.add('active');
    }

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMemoryIndex = (currentMemoryIndex + 1) % memories.length;
      showMemory(currentMemoryIndex);
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      cardContainer.classList.remove('active');
    });

    cardContainer.addEventListener('click', (e) => {
      if (e.target === cardContainer) cardContainer.classList.remove('active');
    });

    // 7. Бесшовный пролет в центр
    let flightActive = false;
    let flightProgress = 0;
    const startCamPos = new THREE.Vector3(0, 0, isMobile ? 42 : 36);
    const endCamPos = new THREE.Vector3(0, isMobile ? 28 : 26, isMobile ? 64 : 56);

    function startHyperspaceFlight() {
      flightActive = true;
      startHint.style.opacity = '0';
      setTimeout(() => startHint.remove(), 400);

      if (bgMusic) bgMusic.play().catch(e => console.log(e));
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Кометы
      meteors.forEach(m => {
        if (!m.active) {
          m.timer -= 0.016;
          if (m.timer <= 0) {
            m.active = true;
            m.mesh.position.set(
              (Math.random() - 0.5) * 90 + 20,
              25 + Math.random() * 20,
              -30 + (Math.random() - 0.5) * 40
            );
            m.mesh.material.opacity = 0.85;
          }
        } else {
          m.mesh.position.x -= m.speed;
          m.mesh.position.y -= m.speed * 0.5;
          m.mesh.position.z -= m.speed * 0.6;
          m.mesh.material.opacity -= 0.012;
          if (m.mesh.material.opacity <= 0) {
            m.active = false;
            m.timer = 1.2 + Math.random() * 3.5;
          }
        }
      });

      // Спираль слов до старта
      if (!flightActive && flightProgress === 0) {
        spiralGroup.rotation.z = -t * 0.16;
      }

      // Полет сквозь спираль
      if (flightActive) {
        flightProgress += 0.012;
        const p = Math.min(flightProgress, 1);
        const ease = p * p * (3 - 2 * p);

        camera.position.x = (1 - ease) * startCamPos.x + ease * endCamPos.x;
        camera.position.y = Math.sin(ease * Math.PI * 0.5) * endCamPos.y;
        camera.position.z = THREE.MathUtils.lerp(startCamPos.z, endCamPos.z, ease);
        camera.lookAt(0, 0, 0);

        spiralGroup.rotation.z -= (0.02 + ease * 0.1);
        spiralWords.forEach(s => {
          s.position.x = s.userData.baseX * (1 + ease * 4.0);
          s.position.y = s.userData.baseY * (1 + ease * 4.0);
          s.material.opacity = Math.max(0, 0.98 - ease * 1.3);
        });

        galaxyWorld.scale.set(ease, ease, ease);
        galaxy.rotation.y += (1 - p) * 0.08;

        if (p >= 1) {
          flightActive = false;
          scene.remove(spiralGroup);
          controls.enabled = true;
        }
      }

      // Жизнь мира после прилета
      if (flightProgress >= 1) {
        galaxy.rotation.y += 0.002;
        nebulaLake.rotation.y = -t * 0.014;

        // Вращение гирлянды вокруг сцены
        garlandGroup.rotation.y = t * 0.06;

        // Естественное покачивание полароидов
        polaroidSprites.forEach((b) => {
          const d = b.userData;
          const currentRotation = t * 0.06;
          const totalT = (d.tVal + currentRotation / (Math.PI * 2)) % 1;
          const pt = garlandPath.getPoint(totalT);

          b.position.x = pt.x;
          b.position.z = pt.z;

          // Мягкое раскачивание на веревке
          const swayY = Math.sin(t * d.swingSpeed + d.swingOffset) * 0.25;
          b.position.y = pt.y - 1.8 + swayY;

          // Динамический масштаб при приближении к камере
          const proximity = (b.position.z > 0) ? (b.position.z / ropeRadius) * 0.32 : 0;
          b.scale.set(d.scaleW * (1 + proximity), d.scaleH * (1 + proximity), 1);
        });

        // Мягкое мерцание светодиодных кристаллов
        garlandBulbs.material.opacity = 0.8 + Math.sin(t * 4.2) * 0.2;

        // Пульсация сердца
        const beat = 1 + Math.sin(t * 3.4) * 0.07;
        heart.scale.set(beat, beat, beat);
        innerCore.scale.set(beat * 1.1, beat * 1.1, beat * 1.1);
        heartLight.intensity = 2.8 + Math.sin(t * 3.4) * 1.5;

        // Искры
        const posAttr = embersGeo.attributes.position;
        for (let i = 0; i < embersCount; i++) {
          posAttr.array[i * 3 + 1] += embersVelocity[i].y;
          posAttr.array[i * 3] += embersVelocity[i].x;
          posAttr.array[i * 3 + 2] += embersVelocity[i].z;
          if (posAttr.array[i * 3 + 1] > 18) {
            posAttr.array[i * 3 + 1] = 3.5;
            posAttr.array[i * 3] = (Math.random() - 0.5) * 10;
            posAttr.array[i * 3 + 2] = (Math.random() - 0.5) * 8;
          }
        }
        embersGeo.needsUpdate = true;

        controls.update();
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const mob = window.innerWidth < window.innerHeight;
      camera.fov = mob ? 74 : 60;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
